      cats.map(cat => '<button class="chip-btn' + (S.plan.cats.includes(cat) ? ' on' : '') + '" data-act="plan-cat" data-cat="' + esc(cat) + '" aria-pressed="' + S.plan.cats.includes(cat) + '">' + esc(cat) + '</button>').join('') + '</div></div>' +
      (city.meals.length ? '<label class="pc-check"><input type="checkbox" id="plan-lunch-' + where + '" data-plan="lunch"' + (S.plan.lunch ? ' checked' : '') + '> Add a lunch stop with ' + city.meals.length + ' places to choose from</label>' : '') +
      '</div>';
  }

  function vHome() {
    const city = curCity(), g = getTrip(city.guide), sample = getTrip(city.sample);
    if (!g) return '<div class="wrap"><section class="block">' + cityStrip('Pick a city') + '<p class="notice">This city has no guide yet. Build one in Create route.</p></section></div>';
    const c = C.compute(g);
    const first = g.stops.slice(0, 4).map((s, i) => '<li><span>' + esc(s.name.replace(/\s*\(.*\)/, '')) + '</span><span>' + C.fmtClock(c.schedule[i].arrive) + '</span></li>').join('');
    const others = tripsIn(city.id).filter(t => t.id !== g.id && (!sample || t.id !== sample.id)).slice(0, 5);
    const evs = eventsIn(city.id).filter(e => evStatus(e).cls !== 'past');
    const posts = postsFor(city.id).sort((a, b) => (b.city === city.id) - (a.city === city.id)).slice(0, 3);
    const mealStop = g.stops.find(s => s.meals && s.meals.length);
    return '<div class="wrap">' +
      '<section class="hero" ' + trailVar(g) + '><div><span class="eyebrow">' + esc(city.country) + ' · free PDF guide · ' + esc(city.tag) + '</span>' +
      '<h1>' + esc(city.name) + '<br>in <em>one day.</em></h1>' +
      '<p class="lead">' + esc(city.lead) + '</p>' +
      '<div class="row"><button class="btn btn-primary" data-act="download" data-id="' + esc(g.id) + '">' + ico('dl') + 'Download the ' + esc(city.name) + ' guide</button>' +
      (sample ? '<button class="btn" data-act="go" data-view="free">Try the free ' + sample.stops.length + '-stop walk</button>' : '') + '</div>' +
      '<div class="facts"><span>' + c.stops + ' stops</span><span>' + C.fmtDist(c.distM) + '</span><span>about ' + C.fmtDur(c.total) + '</span>' + (mealStop ? '<span>' + mealStop.meals.length + ' lunch options</span>' : '') + '</div>' +
      cityStrip() + '</div>' +
      '<div class="ticket">' + photoPic(city.photo, city.scene, city.id + '-hero', '', true) +
      '<div class="stub"><h3><span class="tm"></span>Today’s line</h3><ol class="mline">' + first + '<li class="more"><span>+ ' + (g.stops.length - 4) + ' more stops</span><span>' + C.fmtClock(c.endMin) + '</span></li></ol></div></div></section>' +

      '<section class="block"><div class="sec-head"><div><span class="eyebrow">The product</span><h2>What’s inside every guide</h2><p>One PDF per city that you can open offline on your phone. Everything is in walking order, so you never have to plan on the street.</p></div></div>' +
      '<div class="feat">' +
      '<div>' + ico('pin').replace('class="icon"', '') + '<h3>The route</h3><p>' + c.stops + ' stops in ' + esc(city.name) + ', in the order that wastes the fewest steps.</p></div>' +
      '<div>' + ico('map').replace('class="icon"', '') + '<h3>The map</h3><p>A clear route map, plus one tap to open the whole walk in Google Maps.</p></div>' +
      '<div>' + ico('clock').replace('class="icon"', '') + '<h3>The timing</h3><p>Arrival times from ' + C.fmtClock(c.startMin) + ', minutes per stop and walking minutes between them.</p></div>' +
      '<div>' + ico('fork').replace('class="icon"', '') + '<h3>Lunch, sorted</h3><p>' + (mealStop ? mealStop.meals.length + ' real places to eat near the route. Pick one and it goes into your PDF.' : 'Local tips on where to eat along the way.') + '</p></div>' +
      '</div></section>' +

      '<section class="block" ' + trailVar(g) + '><div class="sec-head"><div><span class="eyebrow">The route at a glance</span><h2>' + esc(g.title) + '</h2><div class="row" style="margin-top:10px">' + walkedChip(g) + '</div></div><button class="btn btn-sm btn-ghost" data-act="go" data-view="trip" data-id="' + esc(g.id) + '">See every stop</button></div>' +
      hline(g) + '</section>' +

      (evs.length ? '<section class="block"><div class="sec-head"><div><span class="eyebrow">Coming up in ' + esc(city.name) + '</span></div><button class="btn btn-sm btn-ghost" data-act="go" data-view="events">All events</button></div>' + evs.map(ev => eventCard(ev, false)).join('') + '</section>' : '') +

      (sample ? '<section class="block" ' + trailVar(sample) + '><div class="sec-head"><div><span class="eyebrow">Free short walk</span><h2>' + esc(sample.title) + '</h2><p>' + esc(sample.tagline) + '</p></div><button class="btn btn-dark" data-act="go" data-view="free">Open the free walk</button></div>' +
        '<div class="grid g3">' + sample.stops.map((s, i) => '<button class="pcard" data-act="go" data-view="free" data-stop="' + i + '">' + photoPic(wikiFor(sample, s), s.type, sample.id + s.id, '', false, true) + '<div><span class="chip blue cat">Stop ' + (i + 1) + ' · ' + s.stay + ' min</span><h3>' + esc(s.name) + '</h3><p>' + esc(s.desc) + '</p></div></button>').join('') + '</div></section>' : '') +

      '<section class="block create"><div class="create-in"><div><span class="eyebrow">Plan my day</span><h2>Your own route in ' + esc(city.name) + '</h2><p>Tell us how much time you have and what you like. We pick places from our ' + esc(city.name) + ' library, put them in walking order, add lunch and time the whole day. Then edit it, save it and download your PDF.</p>' +
      '<div class="row" style="margin-top:18px"><button class="btn" data-act="new-trip">' + ico('plus') + 'Start from scratch</button></div></div>' +
      '<div class="plan-box">' + planControls(city, 'home') + '<button class="btn btn-primary plan-go" data-act="plan-go" data-city="' + city.id + '">' + ico('spark') + 'Plan my day</button></div></div></section>' +

      '<section class="block"><div class="sec-head"><div><span class="eyebrow">Trip library</span><h2>More routes in ' + esc(city.name) + '</h2><p>Every route gets its own page, map and PDF.</p></div><button class="btn btn-sm btn-ghost" data-act="trip-city" data-city="' + city.id + '">All ' + esc(city.name) + ' routes</button></div>' +
      '<div class="grid g3">' + others.map(tripCard).join('') + newTripCard() + '</div></section>' +

      (posts.length ? '<section class="block"><div class="sec-head"><div><span class="eyebrow">Travel blog</span><h2>From the blog</h2></div><button class="btn btn-sm btn-ghost" data-act="blog-city" data-city="' + city.id + '">More posts</button></div>' +
        '<div class="grid g3">' + posts.map(p => postCard(p)).join('') + '</div></section>' : '') +

      '<section class="block"><div class="sec-head"><div><span class="eyebrow">' + CITIES.length + ' cities</span><h2>Plan your next weekend</h2><p>The same format in every city: a full-day guide, a free short walk, places to eat and a route planner.</p></div><button class="btn btn-sm btn-ghost" data-act="go" data-view="cities">All cities</button></div>' +
      '<div class="grid g3">' + CITIES.filter(x => x.id !== city.id).slice(0, 3).map(x => cityCard(x)).join('') + '</div></section>' +

      '<section class="block"><div class="sec-head"><div><span class="eyebrow">Who it’s for</span><h2>Made for short trips</h2></div></div><div class="grid g2">' +
      '<div class="panel"><h3 style="font-size:21px">Students</h3><p class="muted" style="margin-top:8px">Visiting a friend at uni, a weekend between exams, an Erasmus guest to show around. Mostly free stops, cheap lunch, phone-first.</p></div>' +
      '<div class="panel"><h3 style="font-size:21px">Weekend visitors</h3><p class="muted" style="margin-top:8px">Arriving Saturday morning, leaving Sunday. You want the highlights in a sensible order without reading ten blog lists.</p></div>' +
      '</div>' +
      '<div class="grid g2" style="margin-top:26px">' +
      faq('Is the guide free?', 'Yes, during the pilot. We want to learn which parts people use before we add paid guides.') +
      faq('Which cities are there?', CITIES.map(x => x.name).join(', ') + '. Each one has a full-day guide, a free short walk, places to eat and a place library for your own routes.') +
      faq('Does it work offline?', 'The PDF does. Download it on Wi-Fi and open it from your phone’s files. Only the Google Maps link needs data.') +
      faq('How are the times worked out?', 'From real distances between stops at a relaxed pace (about 4.5 km/h, plus 25% for real streets). Routes we have walked ourselves show a “Walked and timed” badge.') +
      '</div></section></div>';
  }

  function vCities() {
    const q = S.cityQ.trim().toLowerCase();
    const list = CITIES.filter(c => !q || (c.name + ' ' + c.local + ' ' + c.country + ' ' + c.tag).toLowerCase().includes(q));
    return '<div class="wrap"><section class="block"><div class="sec-head"><div><span class="eyebrow">Cities</span><h2>Where are you going this weekend?</h2><p>Pick a city to see its full-day guide, free short walk, places to eat and events. You can switch any time from the city button at the top.</p></div>' +
      '<div class="row"><label class="sr" for="city-q">Search cities</label><input type="text" id="city-q" placeholder="Search cities" value="' + esc(S.cityQ) + '" style="width:220px"></div></div>' +
      '<div class="grid g3" id="city-grid">' + list.map(c => cityCard(c, true)).join('') +
      '<button class="tcard new" data-act="new-trip" data-other="1"><span class="plus">+</span><h3>Another city</h3><p class="muted">Going somewhere else? Build a route anywhere: add stops with coordinates from Google Maps and get the same PDF.</p></button></div></section></div>';
  }

  function vTrips() {
    const q = S.tripQ.trim().toLowerCase();
    const kinds = [['all', 'All'], ['guide', 'Full-day guides'], ['sample', 'Free short walks'], ['event', 'Event walks'], ['custom', 'Your routes']];
    const list = allTrips().filter(t => (S.tripCity === 'all' || cityIdOf(t) === S.tripCity) && (S.tripKind === 'all' || t.kind === S.tripKind) && (!q || (t.title + ' ' + t.city + ' ' + t.tagline).toLowerCase().includes(q)));
    const status = S.db ? (S.sharedReady ? '' : '<p class="muted">Loading team trips…</p>') : '';
    return '<div class="wrap"><section class="block"><div class="sec-head"><div><span class="eyebrow">Trip library</span><h2>All routes</h2><p>' + allTrips().length + ' routes in ' + CITIES.length + ' cit' + (CITIES.length === 1 ? 'y' : 'ies') + '. Each one has a page, a route map, a timing plan and a downloadable PDF.</p></div>' +
      '<div class="row"><label class="sr" for="trip-q">Search routes</label><input type="text" id="trip-q" placeholder="Search by city or title" value="' + esc(S.tripQ) + '" style="width:240px"><button class="btn btn-dark" data-act="new-trip">' + ico('plus') + 'New route</button></div></div>' + status +
      '<div class="filters" role="group" aria-label="Filter by city"><button class="btn btn-sm' + (S.tripCity === 'all' ? ' on' : ' btn-ghost') + '" data-act="trip-city" data-city="all" aria-pressed="' + (S.tripCity === 'all') + '">All cities</button>' +
      CITIES.map(c => '<button class="btn btn-sm' + (S.tripCity === c.id ? ' on' : ' btn-ghost') + '" data-act="trip-city" data-city="' + c.id + '" aria-pressed="' + (S.tripCity === c.id) + '">' + esc(c.name) + '</button>').join('') + '</div>' +
      '<div class="filters" role="group" aria-label="Filter by type" style="margin-top:-14px">' + kinds.map(([k, l]) => '<button class="btn btn-sm' + (S.tripKind === k ? ' on' : ' btn-ghost') + '" data-act="trip-kind" data-kind="' + k + '" aria-pressed="' + (S.tripKind === k) + '">' + l + '</button>').join('') + '</div>' +
      '<div class="grid g3" id="trip-grid">' + list.map(tripCard).join('') + newTripCard() + '</div>' +
      (list.length ? '' : '<p class="muted" style="margin-top:14px">No routes match these filters yet.</p>') + '</section></div>';
  }

  function vTrip(t, free) {
    if (!t) return notFound('That trip doesn’t exist any more. It may have been deleted.', 'trips');
    const c = C.compute(t), key = 'trip:' + t.id, city = getCity(cityIdOf(t)), guide = city ? getTrip(city.guide) : null;
    const manage = t._src === 'local' || (t._src === 'shared' && canShared());
    const del = S.confirmDel === t.id;
    const actions =
      '<button class="btn btn-primary" data-act="download" data-id="' + esc(t.id) + '">' + ico('dl') + 'Download PDF</button>' +
      '<a class="btn" href="' + esc(C.mapsUrl(t)) + '" target="_blank" rel="noopener noreferrer">' + ico('map') + 'Open in Google Maps</a>' +
      saveBtn(key) + shareBtn(key, t.title) +
      (manage ? '<button class="btn" data-act="edit" data-id="' + esc(t.id) + '">' + ico('edit') + 'Edit</button>' : '') +
      '<button class="btn btn-ghost" data-act="duplicate" data-id="' + esc(t.id) + '">' + ico('copy') + 'Duplicate</button>' +
      (manage ? (del ? '<span class="confirm">Delete this route' + (t._src === 'shared' ? ' for everyone' : '') + '? <button class="btn btn-sm btn-primary" data-act="delete-yes" data-id="' + esc(t.id) + '">Delete</button><button class="btn btn-sm" data-act="delete-no">Keep</button></span>' : '<button class="btn btn-ghost" data-act="delete" data-id="' + esc(t.id) + '">' + ico('trash') + 'Delete</button>') : '');
    const kv = [['For', t.audience], ['Best time', t.bestTime], ['Level', t.difficulty]].filter(x => x[1]);
    const by = authorOf(t);
    const stops = t.stops.map((s, i) => {
      const leg = c.legs[i];
      return '<li>' + (leg ? '<div class="walk">' + leg.walk + ' min walk' + (leg.meters ? ' · about ' + C.fmtDist(leg.meters) : '') + '</div>' : '') +
        '<div class="stop" id="stop-' + i + '"><div class="num">' + (i + 1) + '</div>' +
        '<div class="when"><span>' + C.fmtClock(c.schedule[i].arrive) + '–' + C.fmtClock(c.schedule[i].leave) + '</span><span>' + s.stay + ' min</span><span>' + esc(WR_STOP_TYPES[s.type] || 'Stop') + '</span></div>' +
        '<h3>' + esc(s.name || 'Stop ' + (i + 1)) + '</h3>' + photoPic(wikiFor(t, s), s.type, t.id + s.id) +
        (s.desc ? '<p class="desc">' + esc(s.desc) + '</p>' : '') +
        (s.tip ? '<div class="tip"><b>TIP</b><span>' + esc(s.tip) + '</span></div>' : '') +
        (s.meals && s.meals.length ? mealBlock(t, s) : '') +
        '<div class="shots">' + (s.photo ? '<span class="s"><b>Photo</b>' + esc(s.photo) + '</span>' : '') +
        '<button class="btn btn-sm btn-ghost" data-act="story" data-id="' + esc(t.id) + '" data-i="' + i + '">' + ico('play', true) + 'Story preview</button>' +
        (s.videoUrl ? '<a class="btn btn-sm btn-ghost" href="' + esc(s.videoUrl) + '" target="_blank" rel="noopener noreferrer">' + ico('ext') + 'Watch the clip</a>' : '') + '</div></div></li>';
    }).join('');
    const tips = t.tips.length ? '<div class="panel"><span class="eyebrow">Before you go</span><ul style="margin:12px 0 0;padding-left:18px;display:grid;gap:8px">' + t.tips.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>' : '';
    const freeBanner = free && guide ? '<div class="banner"><div><h3>Free short walk · part of the ' + esc(city.name) + ' guide</h3><p>The full guide adds more stops, a lunch stop, a map and a timing plan for the whole day.</p></div><div class="row"><button class="btn btn-primary" data-act="download" data-id="' + esc(guide.id) + '">' + ico('dl') + 'Get the full guide</button></div></div>' : '';
    const gc = guide ? C.compute(guide) : null;
    const upsell = guide && guide.id !== t.id ? '<div class="panel" ' + trailVar(guide) + '><span class="eyebrow">Want the full day?</span><h3 style="font-size:22px;margin-top:8px">' + esc(guide.title) + '</h3><p class="muted" style="margin-top:6px">' + gc.stops + ' stops · ' + C.fmtDist(gc.distM) + ' · about ' + C.fmtDur(gc.total) + '.</p><div class="row" style="margin-top:14px"><button class="btn btn-primary btn-sm" data-act="download" data-id="' + esc(guide.id) + '">' + ico('dl') + 'Download PDF</button><button class="btn btn-sm" data-act="go" data-view="trip" data-id="' + esc(guide.id) + '">See the route</button></div></div>' : '';
    return '<div class="wrap" ' + trailVar(t) + '>' + freeBanner +
      '<div class="trip-hero">' + photoPic(tripPhotoTitle(t), (t.stops[0] && t.stops[0].type) || 'other', t.id, '', true) + '<div class="band"></div></div>' +
      '<div class="trip-head"><div><div class="row"><span class="chip"><span class="tm"></span>' + esc(WR_TRAILS[t.trail]) + '</span><span class="chip ' + (t._src === 'builtin' ? 'red' : 'blue') + '">' + esc(kindLabel(t)) + '</span>' +
      (city ? '<button class="chip chip-btn2" data-act="set-city" data-city="' + city.id + '" data-home="1">' + ico('pin') + esc(city.name) + '</button>' : (t.city ? '<span class="chip">' + esc(t.city) + '</span>' : '')) + (by ? '<span class="chip">by ' + esc(by) + '</span>' : '') + walkedChip(t) + '</div>' +
      '<h1 style="margin-top:14px">' + esc(t.title || 'Untitled trip') + '</h1>' + (t.tagline ? '<p class="tagline">' + esc(t.tagline) + '</p>' : '') + '</div></div>' +
      '<div class="stats"><div><span class="eyebrow">Time</span><b>' + C.fmtDur(c.total) + '</b></div><div><span class="eyebrow">Distance</span><b>' + (c.distM ? C.fmtDist(c.distM) : '–') + '</b></div><div><span class="eyebrow">Stops</span><b>' + c.stops + '</b></div><div><span class="eyebrow">Start · finish</span><b>' + C.fmtClock(c.startMin) + '–' + C.fmtClock(c.endMin) + '</b></div></div>' +
      '<div class="actions">' + actions + '</div>' +
      '<div class="trip-body"><div>' + (t.intro ? '<p class="intro">' + esc(t.intro) + '</p>' : '') +
      (kv.length ? '<dl class="kv">' + kv.map(x => '<dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd>').join('') + '</dl>' : '') +
      (t.stops.length ? '<ol class="tl">' + stops + '</ol>' : '<p class="notice" style="margin-top:20px">This route has no stops yet.</p>') + '</div>' +
      '<aside class="trip-side">' + mapBox(t) + upsell + tips + '</aside></div></div>';
  }

  function vEvents() {
    const withEvents = CITIES.filter(c => eventsIn(c.id).length);
    const list = WR_EVENTS.filter(e => S.evCity === 'all' || e.cityId === S.evCity).slice().sort((a, b) => {
      const rank = e => ({ on: 0, soon: 0, tba: 1, past: 2 })[evStatus(e).cls];
      return rank(a) - rank(b) || (a.start || '').localeCompare(b.start || '') || a.title.localeCompare(b.title);
    });
    return '<div class="wrap"><section class="block"><div class="sec-head"><div><span class="eyebrow">Events</span><h2>What’s on</h2><p>Seasonal events with a ready-made walking route or guide, so you can plan the day around them. Dates are checked against official sources.</p></div></div>' +
      '<div class="filters" role="group" aria-label="Filter by city"><button class="btn btn-sm' + (S.evCity === 'all' ? ' on' : ' btn-ghost') + '" data-act="ev-city" data-city="all" aria-pressed="' + (S.evCity === 'all') + '">All cities</button>' +
      withEvents.map(c => '<button class="btn btn-sm' + (S.evCity === c.id ? ' on' : ' btn-ghost') + '" data-act="ev-city" data-city="' + c.id + '" aria-pressed="' + (S.evCity === c.id) + '">' + esc(c.name) + '</button>').join('') + '</div>' +
      '<div class="ev-list">' + list.map(ev => eventCard(ev, true)).join('') + '</div>' +
      (list.length ? '' : '<p class="muted">No events for this city yet.</p>') + '</section></div>';
  }

  function vBlog() {
    const cats = ['All', ...new Set(WR_POSTS.map(p => p.category))];
    const cityIds = [...new Set(WR_POSTS.map(p => p.city).filter(Boolean))];
    const list = WR_POSTS.filter(p => (S.blogCat === 'All' || p.category === S.blogCat) && (S.blogCity === 'all' || (S.blogCity === 'general' ? !p.city : p.city === S.blogCity)));
    return '<div class="wrap"><section class="block"><div class="sec-head"><div><span class="eyebrow">Travel blog</span><h2>Short walks, route snippets and city secrets</h2><p>Stories from planning and walking the routes. Save the ones you want to try and share them with whoever you’re travelling with.</p></div></div>' +
      '<div class="filters" role="group" aria-label="Filter by city"><button class="btn btn-sm' + (S.blogCity === 'all' ? ' on' : ' btn-ghost') + '" data-act="blog-city" data-city="all" aria-pressed="' + (S.blogCity === 'all') + '">All cities</button>' +
      cityIds.map(id => { const c = getCity(id); return '<button class="btn btn-sm' + (S.blogCity === id ? ' on' : ' btn-ghost') + '" data-act="blog-city" data-city="' + id + '" aria-pressed="' + (S.blogCity === id) + '">' + esc(c ? c.name : id) + '</button>'; }).join('') +
      '<button class="btn btn-sm' + (S.blogCity === 'general' ? ' on' : ' btn-ghost') + '" data-act="blog-city" data-city="general" aria-pressed="' + (S.blogCity === 'general') + '">How-to</button></div>' +
      '<div class="filters" role="group" aria-label="Filter by category" style="margin-top:-14px">' + cats.map(c => '<button class="btn btn-sm' + (S.blogCat === c ? ' on' : ' btn-ghost') + '" data-act="cat" data-cat="' + esc(c) + '" aria-pressed="' + (S.blogCat === c) + '">' + esc(c) + '</button>').join('') + '</div>' +
      (list[0] ? postCard(list[0], true) : '<p class="muted">No posts match these filters yet.</p>') +
      '<div class="grid g3" style="margin-top:36px">' + list.slice(1).map(p => postCard(p)).join('') + '</div></section></div>';
  }

  function vPost(p) {
    if (!p) return notFound('That post doesn’t exist.', 'blog');
    const key = 'post:' + p.id, city = getCity(p.city) || curCity(), guide = getTrip(city.guide);
    const body = p.body.map(b => {
      if (b.h) return '<h2>' + esc(b.h) + '</h2>';
      if (b.list) return '<ul>' + b.list.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
      if (b.route) return '<div class="route-snip"><span class="eyebrow">Route snippet</span><ol class="mline">' + b.route.map(x => '<li><span>' + esc(x) + '</span><span></span></li>').join('') + '</ol></div>';
      return '<p>' + esc(b.p) + '</p>';
    }).join('');
    const same = WR_POSTS.filter(x => x.id !== p.id && (x.city === p.city || !x.city));
    const next = same[0] || WR_POSTS[(WR_POSTS.indexOf(p) + 1) % WR_POSTS.length];
    return '<div class="wrap"><article class="article"><button class="btn btn-sm btn-ghost" data-act="go" data-view="blog" style="margin-top:28px">← All posts</button>' +
      pic(p.scene, p.id) + '<div class="row" style="margin-top:22px"><span class="chip blue">' + esc(p.category) + '</span>' + (getCity(p.city) ? '<span class="chip">' + esc(getCity(p.city).name) + '</span>' : '') + '</div><h1>' + esc(p.title) + '</h1>' +
      '<div class="byline"><span>' + fmtDate(p.date) + '</span><span>' + p.read + ' min read</span><span>WeekendReady team</span></div>' +
      '<div class="prose">' + body + '</div>' +
      '<div class="sharebar">' + saveBtn(key, 'Save post') + shareBtn(key, p.title) + '<span class="muted" style="font-size:14px">Saves and shares help us decide which routes to make next.</span></div>' +
      (guide ? '<div class="banner"><div><h3>Walk it with the ' + esc(city.name) + ' guide</h3><p>Route, map, timing and places to eat in one free PDF.</p></div><button class="btn btn-primary" data-act="download" data-id="' + esc(guide.id) + '">' + ico('dl') + 'Download PDF</button></div>' : '') +
      (next ? '<div style="margin-top:40px"><span class="eyebrow">Read next</span><div style="margin-top:14px">' + postCard(next, true) + '</div></div>' : '') + '</article></div>';
  }

  function vSaved() {
    const keys = [...S.saved];
    const trips = keys.filter(k => k.startsWith('trip:')).map(k => getTrip(k.slice(5))).filter(t => t && t._src !== 'local');
    const posts = keys.filter(k => k.startsWith('post:')).map(k => getPost(k.slice(5))).filter(Boolean);
    const evs = keys.filter(k => k.startsWith('event:')).map(k => WR_EVENTS.find(e => e.id === k.slice(6))).filter(Boolean);
    const mine = allTrips().filter(t => t._src !== 'builtin');
    const picks = Object.entries(S.meals).map(([k, opt]) => {
      const i = k.lastIndexOf(':'), t = getTrip(k.slice(0, i)), s = t && t.stops.find(x => x.id === k.slice(i + 1)), o = s && s.meals && s.meals.find(m => m.id === opt);
      return o ? { t, s, o } : null;
    }).filter(Boolean);
    const groups = [
      ['Your routes', mine.length, () => '<div class="grid g3">' + mine.map(tripCard).join('') + '</div>', 'routes you build in Create route'],

  /* ---------- Place library ---------- */
  function libFor(city) {
    if (!city) return [];

    city.places.forEach(p => items.push(p));
    city.meals.forEach(o => items.push({ name: o.name, type: 'meal', cat: 'Food', lat: o.lat, lng: o.lng, stay: 45, desc: o.kind + '. ' + o.address + '.' }));

    const items = libFor(draftCity()).map((p, i) => [p, i]).filter(([p]) => (S.libCat === 'All' || p.cat === S.libCat) && (!q || (p.name + ' ' + p.desc + ' ' + p.cat).toLowerCase().includes(q)));

  function placeStop(p) {

  function optimiseOrder() {
    const st = S.draft.stops;
    const withC = st.filter(s => C.hasCoord(s)), without = st.filter(s => !C.hasCoord(s));
    if (withC.length < 3) { toast('Add at least three stops with coordinates first'); return; }
    const before = C.compute(S.draft).distM;
    const out = [withC.shift()];
    while (withC.length) {
      const last = out[out.length - 1];
      let bi = 0, bd = Infinity;
      withC.forEach((s, i) => { const dd = C.hav(last, s); if (dd < bd) { bd = dd; bi = i; } });
      out.push(withC.splice(bi, 1)[0]);
    }
    S.draft.stops = out.concat(without);
    S.draft.stops.forEach(s => { s.walk = ''; });
    updateStudioLive(true);
    const after = C.compute(S.draft).distM;
    toast(after < before - 10 ? 'Walking order saved you ' + C.fmtDist(before - after) : 'Your stops were already in a good order');
  }

  /* ---------- Route planner ---------- */
  function lunchStop(city, stay) {
    return Object.assign(blankStop(), { name: 'Lunch break: ' + city.meals.length + ' places to choose', type: 'meal', lat: city.lunchHub.lat, lng: city.lunchHub.lng, stay: stay || 60,
      desc: 'A meal stop near ' + city.lunchHub.name + '. Pick one of the places below.', meals: clone(city.meals) });
  }
  /* Greedy plan: from the start place, keep adding the best nearby place (must-sees first, short walks preferred)
     until the time runs out; insert lunch once the clock passes noon. */
  function planDay(city, opts, startClock) {
    const hours = +opts.hours || 6, budget = hours * 60;
    const cap = hours <= 2 ? 25 : hours <= 4 ? 40 : 600;
    const stayOf = p => Math.max(10, Math.min(cap, p.stay || 30));
    const walkMin = (a, b) => Math.max(1, Math.round(C.hav(a, b) * 1.25 / 75));
    const cats = (opts.cats || []).filter(c => city.places.some(p => p.cat === c));
    const withLunch = !!(opts.lunch && hours >= 4 && city.meals.length && city.lunchHub);
    let pool = city.places.filter(p => p.pri > 0 && (cats.length ? cats.includes(p.cat) : p.cat !== 'Further out') && !(withLunch && ['market', 'food', 'cafe', 'meal'].includes(p.type) && C.hav(p, city.lunchHub) < 150));
    let startP = city.places.find(p => p.name === opts.start) || city.places.find(p => p.name === city.start);
    if (!startP) startP = pool.slice().sort((a, b) => b.pri - a.pri)[0] || city.places[0];
    pool = pool.filter(p => p !== startP);
    const first = startP.pri > 0 ? stayOf(startP) : 5;
    const route = [{ p: startP, stay: first }];
    const startMin = C.parseTime(startClock);
    let used = first, t = startMin + first, cur = startP;
    let lunchDone = !withLunch || startMin > 14 * 60;
    for (let guard = 0; guard < 40; guard++) {
      if (!lunchDone && t >= 12 * 60) {
        const w = walkMin(cur, city.lunchHub);
        if (used + w + 50 <= budget) { route.push({ lunch: true, stay: 50 }); used += w + 50; t += w + 50; cur = city.lunchHub; }
        lunchDone = true; continue;
      }
      let cand = pool.map(p => ({ p, w: walkMin(cur, p) })).filter(x => used + x.w + stayOf(x.p) <= budget);
      if (!cand.length) break;
      const near = cand.filter(x => x.w <= 25);
      if (near.length) cand = near;
      cand.sort((a, b) => (b.p.pri * 14 - b.w) - (a.p.pri * 14 - a.w));
      const best = cand[0];
      route.push({ p: best.p, stay: stayOf(best.p) });
      used += best.w + stayOf(best.p); t += best.w + stayOf(best.p);
      cur = best.p; pool = pool.filter(p => p !== best.p);
    }
    // Tidy the order: 2-opt and or-opt over every chosen place (start fixed), then put lunch where it adds
    // the fewest steps while landing between 11:30 and 14:30, ideally close to 12:45.
    const hadLunch = route.some(r => r.lunch);
    const lunchStay = (route.find(r => r.lunch) || {}).stay || 50;
    const pt = r => r.lunch ? city.lunchHub : r.p;
    const pathLen = arr => arr.reduce((sum, r, i) => i ? sum + C.hav(pt(arr[i - 1]), pt(r)) : 0, 0);
    let seq = route.filter(r => !r.lunch);
    for (let pass = 0, better = true; better && pass < 40; pass++) {
      better = false;
      for (let i = 1; i < seq.length - 1; i++) for (let k = i + 1; k < seq.length; k++) {
        const cand = seq.slice(0, i).concat(seq.slice(i, k + 1).reverse(), seq.slice(k + 1));
        if (pathLen(cand) + 1 < pathLen(seq)) { seq = cand; better = true; }
      }
      // or-opt: move a single stop to a better place in the line
      for (let i = 1; i < seq.length; i++) for (let j = 1; j < seq.length; j++) {
        if (j === i) continue;
        const rest = seq.slice(0, i).concat(seq.slice(i + 1));
        const cand = rest.slice(0, j).concat([seq[i]], rest.slice(j));
        if (pathLen(cand) + 1 < pathLen(seq)) { seq = cand; better = true; }
      }
    }
    const totalOf = arr => arr.reduce((sum, r, i) => sum + r.stay + (i ? walkMin(pt(arr[i - 1]), pt(r)) : 0), 0);
    const withLunchAt = arr => {
      if (!hadLunch) return arr;
      let best = null, clock = startMin;
      for (let j = 1; j <= arr.length; j++) {
        clock += arr[j - 1].stay + (j > 1 ? walkMin(arr[j - 2].p, arr[j - 1].p) : 0);
        const arrive = clock + walkMin(arr[j - 1].p, city.lunchHub);
        const added = C.hav(arr[j - 1].p, city.lunchHub) + (j < arr.length ? C.hav(city.lunchHub, arr[j].p) - C.hav(arr[j - 1].p, arr[j].p) : 0);
        const score = added + (arrive >= 690 && arrive <= 870 ? Math.abs(arrive - 765) * 3 : 1e6 + Math.abs(arrive - 765) * 1000);
        if (!best || score < best.score) best = { j, score };
      }
      return arr.slice(0, best.j).concat([{ lunch: true, stay: lunchStay }], arr.slice(best.j));
    };
    let out = withLunchAt(seq);
    // Reordering and the lunch detour can change the total; drop the weakest stops until the plan fits again.
    while (totalOf(out) > budget + 10 && seq.length > 1) {
      let drop = 1;
      for (let i = 2; i < seq.length; i++) if (seq[i].p.pri < seq[drop].p.pri || (seq[i].p.pri === seq[drop].p.pri && i === seq.length - 1)) drop = i;
      seq = seq.filter((_, i) => i !== drop);
      out = withLunchAt(seq);
    }
    return out.map(r => r.lunch ? lunchStop(city, r.stay) : Object.assign(blankStop(), { name: r.p.name, type: r.p.type, lat: r.p.lat, lng: r.p.lng, stay: r.stay, desc: r.p.desc, wiki: r.p.wiki || '' }));
  }
  function applyPlan(cityId, fromStudio) {
    const city = getCity(cityId); if (!city) return;
    const keep = S.draft && S.draft.stops && S.draft.stops.some(s => (s.name || '').trim());
    S.undoStops = keep ? clone(S.draft) : null;
    const label = (HOURS.find(h => h[0] === S.plan.hours) || [0, S.plan.hours + ' hours'])[1];
    const base = (fromStudio && S.draft && S.draft.cityId === cityId) ? S.draft : blankDraft(cityId);
    const start = base.start || '10:00';
    base.stops = planDay(city, S.plan, start);
    if (!base.id && (!base.title || /^(2 hours|Half a day|6 hours|Full day) in /.test(base.title))) base.title = label + ' in ' + city.name;
    if (!base.tagline) base.tagline = 'Made with the route planner' + (S.plan.cats.length ? ': ' + S.plan.cats.join(', ').toLowerCase() : '') + '.';
    if (!(base.tips || []).length) base.tips = city.tips.slice();
    base.cityId = cityId; base.city = city.name; base.water = city.water;
    S.draft = base; saveDraftLocal();
    const c = C.compute(base);
    const msg = 'Planned ' + base.stops.length + ' stops · ' + C.fmtDur(c.total) + ' · ' + C.fmtDist(c.distM);
    if (S.view === 'studio') { render(); } else go('studio');
    toast(msg, S.undoStops ? { act: 'undo-plan', label: 'Undo' } : null);
  }

  /* ---------- Stops editor ---------- */
  function stopsEditor() {
    const d = S.draft, c = C.compute(d), n = d.stops.length;
    if (!n) return '<p class="notice">No stops yet. Use the planner, tap places in the library, or add your own stop.</p>';
    return d.stops.map((s, i) => {

    const cityPRows = CITIES.map(c => [c.name, A.pv['city:' + c.id] || 0]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]);
    const pvRows = Object.entries(A.pv).filter(([k]) => pvLabels[k]).map(([k, n]) => [pvLabels[k], n]).sort((a, b) => b[1] - a[1]);
    const social = S.db ? S.social : S.socialLocal;
    const socT = social.reduce((a, r) => ({ v: a.v + (+r.views || 0), s: a.s + (+r.saves || 0), sh: a.sh + (+r.shares || 0) }), { v: 0, s: 0, sh: 0 });
    const canSoc = !S.db || canShared();
    return '<div class="wrap"><section class="block"><div class="sec-head"><div><span class="eyebrow">What we measure</span><h2>Dashboard</h2><p>Guide downloads, site visits, which cities people pick, and how often routes and posts are saved and shared. Targets are the goals for our four-week pilot.</p></div>' +
      '<div class="row">' + srcChip + '<label class="switch"><input type="checkbox" id="demo-toggle" data-act="demo"' + (S.demo ? ' checked' : '') + '> Show demo data</label></div></div>' + note +
      '<div class="kpis" style="margin-top:18px">' +

      kpi('Unique visitors', fmtN(A.uniq), A.uniq / TARGETS.uniq * 100, null, '', 'Target ' + TARGETS.uniq) +

      kpi('Download rate', (rate * 100).toFixed(1) + '%', rate / TARGETS.rate * 100, null, '', 'Downloads ÷ visits · target 20%') +
      kpi('Saves', fmtN(A.saves), A.saves / TARGETS.saves * 100, ds, 'var(--chart-1)', 'Routes, posts, events · target ' + TARGETS.saves) +
      kpi('Shares', fmtN(A.shares), A.shares / TARGETS.shares * 100, dsh, 'var(--chart-1)', 'Routes, posts, events · target ' + TARGETS.shares) +

      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));margin-top:18px">' +

      '<div class="panel"><span class="eyebrow">Downloads</span><h3 style="font-size:20px;margin:6px 0 14px">By city</h3>' + hbars(cityDRows, 'var(--chart-2)') + '</div>' +

      ((!S.db || S.canEdit) ? '<form id="url-form" class="row" style="margin-top:12px;flex-wrap:nowrap"><label class="sr" for="share-url">Public link</label><input type="url" id="share-url" value="' + esc(S.settings.shareUrl) + '" placeholder="https://claude.ai/…"><button class="btn btn-sm btn-dark" type="submit">Save</button></form>'

  /* ---------- How it works (project outline) ---------- */
  function vConcept() {

    const toc = [['c-summary', 'Summary'], ['c-problem', 'Problem and solution'], ['c-product', 'The product'], ['c-cities', 'Cities'], ['c-audience', 'Audience'], ['c-content', 'Content'], ['c-site', 'Website'], ['c-how', 'How it works'], ['c-app', 'How the app works'], ['c-measure', 'Measurement'], ['c-production', 'Production and checks'], ['c-plan', 'Four-week plan'], ['c-team', 'Team and budget'], ['c-risks', 'Risks'], ['c-next', 'Next steps'], ['c-photos', 'Photos and credits']];
    const funnel = '<div class="tbl-wrap funnel"><svg viewBox="0 0 960 250" style="min-width:640px" role="img" aria-label="Funnel: see a post, pick a city, try the free walk, download the guide, save and share">' +

          '<text x="' + (x + 16) + '" y="136" font-size="12" font-weight="700" fill="var(--ink-2)" letter-spacing="1">' + s[2].toUpperCase() + '</text>' +

      }).join('') +
      '<path d="M 865 155 C 865 225, 95 225, 95 155" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 5"/><path d="M 89 163 L 95 153 L 101 163" fill="none" stroke="var(--muted)" stroke-width="2"/>' +
      '<text x="480" y="236" text-anchor="middle" font-size="13" fill="var(--muted)">Every share puts a route in front of someone new</text></svg></div>';
    const tbl = (head, rows) => '<div class="tbl-wrap" style="margin-top:14px"><table><thead><tr>' + head.map(h => '<th>' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(x => '<td>' + x + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    const cityRows = CITIES.map(c => { const g = getTrip(c.guide), gc = g ? C.compute(g) : null, ev = eventsIn(c.id)[0]; return [esc(c.name) + (c.local !== c.name ? ' <span class="muted">(' + esc(c.local) + ')</span>' : ''), esc(c.country), gc ? gc.stops + ' stops · ' + C.fmtDist(gc.distM) + ' · ' + C.fmtDur(gc.total) : '–', c.places.length, c.meals.length, ev ? esc(ev.title) : '–']; });
    return '<div class="wrap"><section class="block"><div class="sec-head"><div><span class="eyebrow">Project outline</span><h2>WeekendReady: concept and how it works</h2><p>The plan behind the app: what we offer, to whom, in which cities, how we produce and check it, and how we measure whether it works.</p></div><button class="btn btn-primary" data-act="download" data-id="' + esc(curCity().guide) + '">' + ico('dl') + 'See the product (PDF)</button></div>' +
      '<div class="concept"><nav class="toc" aria-label="Sections">' + toc.map(t => '<button data-act="anchor" data-anchor="' + t[0] + '">' + t[1] + '</button>').join('') + '</nav><div>' +
      sec('c-summary', '01 · Summary', 'One-line idea', '<p class="oneliner">Ready-made plans for short city trips: a free full-day PDF guide for every city, a free short walk, places to eat, events and a planner for your own route.</p><p style="margin-top:16px">WeekendReady started with one guide, “Wrocław in One Day”, and now covers ' + CITIES.length + ' cities in the same format. Pick a city, try the free walk, download the guide or let the planner build a day around your time and interests. Social posts bring people in; downloads, visits, city picks, saves and shares tell us if it works.</p>') +
      sec('c-problem', '02 · Problem and solution', 'Too many lists, no plan', '<div class="grid g2"><div><h3>Problem</h3><ul><li>Short visits leave one or two days and no time to research.</li><li>“Top 10” lists are not routes: they ignore order, distance and opening times.</li><li>Map apps show places, not a day that fits together, and say nothing about where to eat on the way.</li></ul></div><div><h3>Solution</h3><ul><li>One route per city in walking order, with real distances and realistic times.</li><li>A PDF that works offline, with one link that opens the whole route in Google Maps.</li><li>A lunch stop with real places to choose from, and a planner for your own day.</li></ul></div></div>') +
      sec('c-product', '03 · The product', 'What you get in every city', tbl(['Part', 'What it is'], [['Full-day guide (PDF)', 'Cover, route map, timing plan, every stop with a description, tip and photo spot, a lunch stop with places to choose from, and practical tips.'], ['Free short walk', 'The first stops of the guide, free on the site, so people can try the format.'], ['Lunch stops', 'Five real places to eat near the route, checked against official sites. Your pick is printed in your PDF.'], ['Event walks', 'Seasonal events such as Christmas markets, with dates, hours and an evening route.'], ['Create route', 'A place library per city, a one-tap route planner, automatic walking order and timing, and a PDF for any route.'], ['Saved', 'Your routes, saved routes, posts, events and lunch picks in one place.']]) + '<p style="margin-top:14px">Price during the pilot: free. We measure demand first and test paid guides later.</p>') +
      sec('c-cities', '04 · Cities', CITIES.length + ' cities, one format', tbl(['City', 'Country', 'Full-day guide', 'Places', 'Places to eat', 'Event'], cityRows) + '<p style="margin-top:14px">A city is data: a centre, river lines for the schematic map, a place library with coordinates, places to eat, tips and its guides. Adding a city means adding that data; the pages, maps, planner and PDF work automatically. For any other city, Create route works with your own stops.</p>') +
      sec('c-audience', '05 · Audience', 'Who we make it for', '<div class="grid g2">' +
        '<div class="panel persona"><div class="who"><span class="av">O</span><div><h3>Ola, 21</h3><span class="muted" style="font-size:14px">Student from Poznań, weekend in another city</span></div></div><p>Visits friends in Wrocław or Kraków. Wants the main sights, a cheap lunch and good photos. Finds trips on Instagram and TikTok, plans on her phone.</p></div>' +
        '<div class="panel persona"><div class="who"><span class="av">T</span><div><h3>Tom and Ania, 28</h3><span class="muted" style="font-size:14px">Couple on a weekend city break</span></div></div><p>Arrive Saturday morning, leave Sunday afternoon. Don’t want to plan; want a route that ends somewhere nice in the evening, in Poland or in Prague.</p></div></div>' +
        '<p style="margin-top:14px">Secondary: Erasmus students and locals who host visitors and want something ready to send them.</p>') +
      sec('c-content', '06 · Content', 'What we publish', tbl(['Format', 'Example', 'Where', 'Goal'], [['“3 places for a short walk”', 'Carousel with the free walk of each city', 'Instagram, blog', 'Saves'], ['Route snippets', '15 s vertical clip between two stops', 'TikTok, Reels, Shorts', 'Reach, shares'], ['City picks', '“Which city this weekend?” poll and comparison posts', 'Instagram Stories, Facebook', 'City picks, visits'], ['Event walks', 'Christmas market evening routes', 'All channels, November–December', 'Visits, downloads'], ['Blog posts', 'One practical post per city', 'Website', 'Visits, downloads']]) + '<p style="margin-top:14px">Rhythm: three posts a week for four weeks. Every post links to a city page; every blog post ends with that city’s PDF.</p>') +
      sec('c-site', '07 · Website', 'Site structure', tbl(['Page', 'Job'], [['City home', 'The city’s guide, free walk, events, planner and posts. The city button at the top switches cities.'], ['Cities', 'All cities with their guides and numbers.'], ['Trips', 'Every route, filtered by city and type.'], ['Free walk', 'The short free route of the current city.'], ['Events', 'Seasonal events with dates, hours, calendar links and routes.'], ['Blog', 'Travel posts, filtered by city, with Save and Share.'], ['Create route', 'Route planner, place library, lunch stops, walking order, PDF, import and export.'], ['Saved', 'Everything the visitor saved, built or picked.'], ['Dashboard', 'Internal: downloads, visits, city picks, saves and shares against pilot targets.'], ['How it works', 'This outline.']])) +
      sec('c-how', '08 · How it works', 'From post to download', funnel + '<ol style="margin-top:16px"><li>A social post or blog article shows one part of a route.</li><li>The link opens that city’s page, where the guide is presented.</li><li>People try the free short walk or plan their own day.</li><li>They download the full PDF guide.</li><li>They save and share routes, posts and events, which brings the next visitors.</li></ol>') +
      sec('c-app', '09 · How the app works', 'Under the hood', '<ul><li><b>One file.</b> The whole app is a single HTML page with no server. On claude.ai it shares routes and numbers with the team; opened as a file it keeps everything in the browser and downloads files directly.</li><li><b>Routes are data.</b> Each route has a city, start time, tips and stops (name, type, coordinates, minutes, description, tip, photo spot, clip idea, places to eat).</li><li><b>Timing.</b> Walking time comes from the straight-line distance between stops plus 25% for real streets, at about 4.5 km/h. You can override any leg.</li><li><b>The planner</b> starts at a place you choose and keeps adding the best nearby place (must-sees first, short walks preferred) until your time runs out, with lunch after noon.</li><li><b>The PDF is generated in the browser</b> for every route: cover, route map, timing plan, stops, lunch options and tips.</li><li><b>Tracking</b> counts visits, page views, city picks, downloads, saves and shares, and adds them up on the Dashboard.</li></ul>') +
      sec('c-measure', '10 · Measurement', 'What we measure', tbl(['Metric', 'Definition', 'How it is measured', 'Pilot target'], [['Guide downloads', 'PDF guides saved to a device', 'Download event in the app', '120'], ['Site visits', 'Times the site was opened', 'Visit event on load', '600'], ['Unique visitors', 'People who opened the site', 'Visitors with at least one visit', '400'], ['Download rate', 'Downloads ÷ visits', 'Calculated on the Dashboard', '20%'], ['City picks', 'Cities chosen in the city switcher', 'City event', 'Report only'], ['Saves', 'Routes, posts and events bookmarked', 'Save event', '80'], ['Shares', 'Share links copied or opened', 'Share event, by channel', '40']])) +
      sec('c-production', '11 · Production and checks', 'Shot on a phone, checked at the source', '<p>For every city we collect the same things:</p><ul><li>Coordinates of each place from Wikipedia, OpenStreetMap or the official site.</li><li>Places to eat checked against their own sites and recent reviews, with the date we checked.</li><li>Event dates and hours from the organiser.</li></ul><p style="margin-top:12px">Then we walk the route with a phone and a stopwatch: one wide photo, one detail photo and one vertical clip per stop, and a lap at every arrival and departure. A route shows “Walked and timed” only after that walk; until then its times are estimates.</p>') +
      sec('c-plan', '12 · Four-week plan', 'Pilot timeline', '<div class="weeks"><div><span class="eyebrow">Week 1</span><h3>Walk and collect</h3><p>Walk and time the Wrocław route, shoot photos and clips, update the guide.</p></div><div><span class="eyebrow">Week 2</span><h3>Launch</h3><p>Publish the app, the free walks and the PDFs. First posts per city and the first blog articles.</p></div><div><span class="eyebrow">Week 3</span><h3>Grow</h3><p>Christmas market walks, share in student groups, log social numbers.</p></div><div><span class="eyebrow">Week 4</span><h3>Measure</h3><p>Compare results with targets, find the best city and content, write the report.</p></div></div>') +
      sec('c-team', '13 · Team and budget', 'Who does what', tbl(['Role', 'Responsibilities'], [['Route and research', 'Route order, timings, opening hours, places to eat, events'], ['Content', 'Photos, clips, blog posts, social posts'], ['Website and data', 'App, PDFs, city data, dashboard, weekly numbers'], ['Community', 'Sharing in student groups, replies, partnerships']]) + '<p style="margin-top:14px">Budget: close to zero. Phones we already own, free tools and train tickets for walk-tests.</p>') +
      sec('c-risks', '14 · Risks', 'What could go wrong', tbl(['Risk', 'What we do about it'], [['Opening hours or a restaurant changes', 'Every list shows the date we checked it and says “check on the day”'], ['Times are off in cities we have not walked', 'Clear “times estimated” label until a walk-test; every leg can be edited'], ['Low reach', 'Post in student and Erasmus groups; event walks for the Christmas season'], ['Photo rights', 'Only our own photos and clips; illustrations elsewhere']])) +
      sec('c-next', '15 · Next steps', 'After the pilot', '<ul><li>Walk-test every city and add “Walked and timed” badges.</li><li>More routes per city: by night, rainy day, with kids.</li><li>Polish and German versions of the guides.</li><li>Test a pay-what-you-want price for new guides; partnerships with hostels and student organisations.</li></ul>') +
      photoSection() +
      '</div></div></section></div>';

  function photoSection() {
    const rows = [], seen = new Set();
    CITIES.forEach(c => c.places.forEach(p => {
      if (!p.wiki || seen.has(p.wiki)) return;
      const e = photoOf(p.wiki); if (!e) return;
      seen.add(p.wiki);
      rows.push('<li><b>' + esc(c.name) + ' · ' + esc(p.name.replace(/\s*\(.*\)/, '')) + '</b> <a href="' + esc(e.page) + '" target="_blank" rel="noopener noreferrer">' + esc(creditText(e)) + '</a></li>');
    }));
    const packN = Object.keys(PACK).filter(k => PACK[k] && isData(PACK[k].ds)).length;
    const status = inViewer()
      ? (packN ? 'This version has ' + packN + ' photos built in.' : 'Photos are not shown on this page: claude.ai does not load images from other websites, so you see the illustrations here. Download the app file and open it in a browser to see the photos.')
      : packN ? 'This copy has ' + packN + ' photos built in' + (PACK_DATE ? ' (saved ' + esc(fmtDate(PACK_DATE)) + ')' : '') + ', so they show offline too.'
      : canFetchPhotos() ? 'Photos load from Wikimedia Commons while you are online' + (rows.length ? ' (' + rows.length + ' so far)' : '') + '. Save a copy with the photos built in to see them offline, for example on a phone.'
      : 'You are offline, so the illustrations are shown. Photos load when you are back online.';
    return '<section class="csec" id="c-photos"><span class="eyebrow">16 · Photos</span><h2>Photos and credits</h2>' +
      '<p>Each place links to its English Wikipedia article. The app shows that article’s lead photo from Wikimedia Commons, but only photos under a free licence (Creative Commons or public domain), with the author and licence on every photo. Tap a credit to see the original and its licence. If a photo cannot load, the illustration stays. Our own phone photos and clips will replace them after the walk tests.</p>' +
      '<p class="notice" style="margin-top:14px">' + status + '</p>' +
      (!inViewer() && PRISTINE ? '<div class="row" style="margin-top:14px"><button class="btn btn-primary" data-act="photo-copy">' + ico('dl') + 'Save a copy with photos built in</button></div>' : '') +
      (rows.length ? '<details class="credits" style="margin-top:16px"><summary>All photo credits (' + rows.length + ')</summary><ul>' + rows.join('') + '</ul></details>' : '') + '</section>';
  }


  /* ---------- Render ---------- */
  function viewHTML() {
    switch (S.view) {
      case 'cities': return vCities();
      case 'trips': return vTrips();
      case 'trip': return vTrip(getTrip(S.id));
      case 'free': { const c = curCity(); return vTrip(getTrip(c.sample), true); }
      case 'events': return vEvents();
      case 'blog': return vBlog();
      case 'post': return vPost(getPost(S.id));
      case 'studio': return vStudio();
      case 'saved': return vSaved();
      case 'dashboard': return vDashboard();
      case 'concept': return vConcept();
      default: return vHome();
    }
  }
  function render() {
    const root = $('#app');
    root.innerHTML = header() + '<main id="main">' + viewHTML() + '</main>' + footer();
  }
  function refresh() {
    if (S.view === 'studio') {
      const mt = $('#my-trips'); if (mt) mt.innerHTML = myTrips();
      const n = $('#access-note'); if (n) n.innerHTML = writeAccess();
      return;
    }
    const a = document.activeElement;
    const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT') && $('#main') && $('#main').contains(a);
    if (typing || $('#city-pop')) return;
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  }
  function rerenderKeep() { const y = window.scrollY; render(); window.scrollTo(0, y); }
  function chooseCity(id, toHome) {
    if (!getCity(id)) return;
    const changed = id !== S.city;
    setCity(id);
    closeCityPop();
    if (toHome || ['cities', 'free'].includes(S.view)) { go('home'); }
    else if (['home', 'events', 'trips', 'blog'].includes(S.view)) {
      if (S.view === 'trips') S.tripCity = id;
      if (S.view === 'events' && eventsIn(id).length) S.evCity = id;
      if (S.view === 'blog' && WR_POSTS.some(p => p.city === id)) S.blogCity = id;
      try { history.replaceState(null, '', '#' + hashFor(S.view)); } catch (e) { /* ignore */ }
      if (S.view === 'home') window.scrollTo({ top: 0, behavior: 'auto' });
      rerenderKeep();
    } else rerenderKeep();
    if (changed) toast('City: ' + getCity(id).name);
  }

  /* ---------- Events ---------- */
  function scrollToId(id) { const el = document.getElementById(id); if (el) el.scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' }); }
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) {
      if ($('#city-pop') && !e.target.closest('#city-pop')) closeCityPop();
      if (S.shareFor && !e.target.closest('#share-pop')) closeShare();
      return;
    }
    const act = el.dataset.act, id = el.dataset.id;
    if (act !== 'city-pop' && act !== 'set-city' && $('#city-pop') && !el.closest('#city-pop')) closeCityPop();
    switch (act) {
      case 'go': {
        if (el.dataset.evcity) S.evCity = el.dataset.evcity;
        go(el.dataset.view, id);
        if (el.dataset.stop != null) setTimeout(() => { scrollToId('stop-' + el.dataset.stop); }, 30);
        if (el.dataset.anchor) setTimeout(() => scrollToId(el.dataset.anchor), 30);
        break;
      }
      case 'anchor': scrollToId(el.dataset.anchor); break;
      case 'city-pop': if ($('#city-pop')) closeCityPop(); else openCityPop(); break;
      case 'set-city': chooseCity(el.dataset.city, !!el.dataset.home); break;
      case 'download': { const t = getTrip(id); if (t) downloadPDF(t, true); break; }
      case 'save': {
        const k = el.dataset.key;
        if (S.saved.has(k)) { S.saved.delete(k); track('unsave', k); toast('Removed from saved'); }
        else { S.saved.add(k); track('save', k); toast('Saved'); }
        store.set('wr.saved', [...S.saved]);
        const on = S.saved.has(k);
        $$('[data-act="save"][data-key="' + CSS.escape(k) + '"]').forEach(b => { b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); b.innerHTML = ico('save', on) + (on ? 'Saved' : (k.startsWith('post:') ? 'Save post' : 'Save')); });
        const sb = $('.saved-btn'); if (sb) { const n = S.saved.size; sb.innerHTML = ico('save', S.view === 'saved') + (n ? '<span class="badge" aria-hidden="true">' + n + '</span>' : ''); sb.setAttribute('aria-label', 'Saved items' + (n ? ' (' + n + ')' : '')); }
        break;
      }
      case 'share': openShare(el.dataset.key, el.dataset.title); break;
      case 'close-share': closeShare(); break;
      case 'share-ch': if (S.shareFor) track('share', S.shareFor, el.dataset.ch); break;
      case 'share-copy': {
        const f = $('#share-field'), k = S.shareFor;
        const done = () => { toast('Copied'); if (k) track('share', k, 'copy'); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(f.value).then(done, () => { f.focus(); f.select(); toast('Press Ctrl+C (or ⌘C) to copy'); if (k) track('share', k, 'copy'); });
        else { f.focus(); f.select(); toast('Press Ctrl+C (or ⌘C) to copy'); if (k) track('share', k, 'copy'); }
        break;
      }
      case 'story': openStory(id, +el.dataset.i); break;
      case 'close-modal': closeModal(); break;
      case 'pin': scrollToId('stop-' + el.dataset.i); $$('.stop').forEach((s, i) => s.classList.toggle('hl', i === +el.dataset.i)); break;
      case 'cat': S.blogCat = el.dataset.cat; rerenderKeep(); break;
      case 'blog-city': S.blogCity = el.dataset.city; if (S.view !== 'blog') go('blog'); else rerenderKeep(); break;
      case 'trip-city': S.tripCity = el.dataset.city; if (S.view !== 'trips') go('trips'); else rerenderKeep(); break;
      case 'trip-kind': S.tripKind = el.dataset.kind; rerenderKeep(); break;
      case 'ev-city': S.evCity = el.dataset.city; rerenderKeep(); break;
      case 'theme': applyTheme(el.dataset.theme); rerenderKeep(); break;
      case 'new-trip': S.draft = template(el.dataset.other ? 'other' : 'blank'); store.set('wr.draft', S.draft); go('studio'); if (el.dataset.other) setTimeout(() => { const f = $('#f-city'); if (f) f.focus(); }, 40); break;
      case 'edit': go('edit', id); break;
      case 'duplicate': { const t = getTrip(id); if (!t) break; const d = normTrip(clone(t)); d.id = ''; d.title = 'Copy of ' + t.title; d.createdBy = ''; d.createdAt = ''; d.kind = 'custom'; d.walked = ''; d.cityId = cityIdOf(t); S.draft = d; go('studio'); toast('Copy ready to edit'); break; }
      case 'delete': S.confirmDel = id; refresh(); break;
      case 'delete-no': S.confirmDel = null; refresh(); break;
      case 'delete-yes': deleteTrip(id); break;
      case 'tpl': S.draft = template(el.dataset.tpl); saveDraftLocal(); rerenderKeep(); break;
      case 'add-stop': S.draft.stops.push(blankStop()); updateStudioLive(true); { const last = $$('#stops-ed .stop-ed'); const inp = last.length && $('input', last[last.length - 1]); if (inp) inp.focus(); } break;
      case 'stop-del': S.draft.stops.splice(+el.dataset.i, 1); updateStudioLive(true); break;
      case 'stop-up': case 'stop-down': {
        const i = +el.dataset.i, j = act === 'stop-up' ? i - 1 : i + 1, st = S.draft.stops;
        if (j < 0 || j >= st.length) break;
        [st[i], st[j]] = [st[j], st[i]]; updateStudioLive(true);
        const b = $('[data-act="' + act + '"][data-i="' + j + '"]'); if (b && !b.disabled) b.focus();
        break;
      }
      case 'save-trip': saveTrip(); break;
      case 'pdf-draft': { const t = normTrip(S.draft); if (!t.title) t.title = 'Untitled route'; downloadPDF(t, false); break; }
      case 'export-json': { const t = normTrip(S.draft); saveFile(C.slug(t.title || 'route') + '.json', JSON.stringify(t, null, 2), 'Route exported'); break; }
      case 'soc-del': deleteSocial(id); break;
      case 'meal-pick': {
        const k = el.dataset.key, o = el.dataset.opt;
        if (S.meals[k] === o) delete S.meals[k]; else S.meals[k] = o;
        store.set('wr.meals', S.meals);
        rerenderKeep();
        const b = $('[data-act="meal-pick"][data-key="' + CSS.escape(k) + '"][data-opt="' + CSS.escape(o) + '"]'); if (b) b.focus({ preventScroll: true });
        break;
      }
      case 'lib-cat': S.libCat = el.dataset.cat; refreshLib(); break;
      case 'add-place': addPlace(+el.dataset.p); break;
      case 'optimise': optimiseOrder(); break;
      case 'plan-hours': S.plan.hours = +el.dataset.h; store.set('wr.plan', S.plan); $$('[data-act="plan-hours"]').forEach(b => { const on = +b.dataset.h === S.plan.hours; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); break;
      case 'plan-cat': {
        const c = el.dataset.cat, i = S.plan.cats.indexOf(c);
        if (i >= 0) S.plan.cats.splice(i, 1); else S.plan.cats.push(c);
        store.set('wr.plan', S.plan);
        $$('[data-act="plan-cat"]').forEach(b => { const on = S.plan.cats.includes(b.dataset.cat); b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
        break;
      }
      case 'plan-go': applyPlan(el.dataset.city, !!el.dataset.replace); break;
      case 'undo-plan': if (S.undoStops) { S.draft = S.undoStops; S.undoStops = null; saveDraftLocal(); if (S.view === 'studio') rerenderKeep(); toast('Plan undone'); } break;
      case 'photo-copy': saveCopyWithPhotos(el); break;
      case 'ics': { const ev = WR_EVENTS.find(x => x.id === id); if (ev) saveFile(ev.id + '.ics', new Blob([icsFor(ev)], { type: 'text/calendar' }), 'Calendar file saved. Open it to add the event.'); break; }
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeShare(); if ($('#city-pop')) { closeCityPop(); const c = $('#city-chip'); if (c) c.focus(); } }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g.pin')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  document.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'lib-q') { S.libQ = t.value; const l = $('#lib-list'); if (l) l.innerHTML = libList(); return; }
    if (t.id === 'city-q') { S.cityQ = t.value; const g = $('#city-grid'); if (g) { const q = S.cityQ.trim().toLowerCase(); g.innerHTML = CITIES.filter(c => !q || (c.name + ' ' + c.local + ' ' + c.country + ' ' + c.tag).toLowerCase().includes(q)).map(c => cityCard(c, true)).join(''); } return; }
    if (t.id === 'trip-q') {
      S.tripQ = t.value; const g = $('#trip-grid');
      if (g) { const q = S.tripQ.trim().toLowerCase(); g.innerHTML = allTrips().filter(x => (S.tripCity === 'all' || cityIdOf(x) === S.tripCity) && (S.tripKind === 'all' || x.kind === S.tripKind) && (!q || (x.title + ' ' + x.city + ' ' + x.tagline).toLowerCase().includes(q))).map(tripCard).join('') + newTripCard(); }
      return;
    }
    if (t.dataset.plan) {
      if (t.dataset.plan === 'lunch') S.plan.lunch = t.checked;
      if (t.dataset.plan === 'start') S.plan.start = t.value;
      store.set('wr.plan', S.plan);
      $$('[data-plan="lunch"]').forEach(x => { if (x !== t) x.checked = S.plan.lunch; });
      return;
    }
    if (!S.draft || S.view !== 'studio') return;
    if (t.dataset.f) {
      const k = t.dataset.f;
      if (k === 'tips') S.draft.tips = t.value.split('\n');
      else if (k === 'trail') { if (t.checked) S.draft.trail = t.value; }
      else if (k === 'cityId') {
        const c = getCity(t.value);
        S.draft.cityId = c ? c.id : ''; S.draft.city = c ? c.name : ''; S.draft.water = c ? c.water : undefined; S.libCat = 'All'; S.libQ = '';
        saveDraftLocal(); rerenderKeep();
        const sel = $('#f-cityId'); if (sel) sel.focus();
        return;
      }
      else S.draft[k] = t.value;
      updateStudioLive(false);
    } else if (t.dataset.sf) {
      const s = S.draft.stops[+t.dataset.i]; if (!s) return;
      const k = t.dataset.sf;
      if ((k === 'name' || k === 'coords') && s.wiki) s.wiki = ''; // edited by hand: the photo is matched by coordinates again
      if (k === 'coords') { const p = C.parseCoords(t.value); if (p) { s.lat = p.lat; s.lng = p.lng; } else if (!t.value.trim()) { s.lat = ''; s.lng = ''; } }
      else if (k === 'stay') s.stay = t.value === '' ? 0 : Math.max(0, +t.value || 0);
      else if (k === 'walk') s.walk = t.value === '' ? '' : Math.max(0, +t.value || 0);
      else if (k === 'meals') {
        const old = s.meals || [];
        s.meals = t.value.split('\n').map(l => l.split('|').map(x => x.trim())).filter(p => p[0]).slice(0, 8).map((p, j) => {
          const prev = old.find(o => o.name === p[0]) || {};
          return Object.assign({}, prev, { id: prev.id || 'm' + (j + 1) + rid(3), name: p[0], address: p[1] || '', note: p[2] || '' });
        });
      } else if (k === 'type') {
        s.type = t.value; updateStudioLive(true);
        const sel = $('#s-' + s.id + '-type'); if (sel) sel.focus();
        return;
      }
      else s[k] = t.value;
      updateStudioLive(false);
    }
  });
  document.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'demo-toggle') { S.demo = t.checked; rerenderKeep(); return; }
    if (t.id === 'import-file' && t.files && t.files[0]) {
      const r = new FileReader();
      r.onload = () => {
        try {
          let data = JSON.parse(String(r.result));
          const many = Array.isArray(data); if (many) data = data[0];
          const d = normTrip(data); d.id = ''; d.createdBy = ''; d.createdAt = ''; d.kind = 'custom';
          if (!d.cityId) d.cityId = cityIdOf(d);
          if (!d.stops.length) d.stops = [blankStop(), blankStop()];
          S.draft = d; rerenderKeep(); toast(many ? 'Loaded the first route from the file' : 'Route loaded. Review it and press Save route.');
        } catch (err) { toast('That file isn’t a route export. Choose a .json file exported from Create route.'); }
      };
      r.readAsText(t.files[0]);
    }
  });
  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'soc-form') addSocial();
    if (e.target.id === 'url-form') saveShareUrl();
  });
  document.addEventListener('pointermove', chartHover);
  document.addEventListener('pointerleave', () => chartHover({ target: document.body }), true);

  async function addSocial() {
    const v = id => ($('#' + id) || {}).value || '';
    const row = { date: v('soc-date') || dayKey(), platform: v('soc-platform'), title: v('soc-title').slice(0, 140), url: /^https:\/\/\S+$/.test(v('soc-url')) ? v('soc-url').slice(0, 400) : '', views: Math.max(0, +v('soc-views') || 0), saves: Math.max(0, +v('soc-saves') || 0), shares: Math.max(0, +v('soc-shares') || 0), by: S.uid || '', at: new Date().toISOString() };
    if (!row.title.trim()) { toast('Add the post name first'); return; }
    const id = 'p' + Date.now().toString(36) + rid(3);
    if (S.db) {
      try { await S.db.doc('social/' + id).set(row); toast('Post added'); }
      catch (e) { toast('Could not add the post. You may have view-only access.'); }
    } else { S.socialLocal.push(Object.assign({ id }, row)); store.set('wr.social.local', S.socialLocal); toast('Post added on this device'); rerenderKeep(); }
  }
  async function deleteSocial(id) {
    if (S.db) { try { await S.db.doc('social/' + id).delete(); } catch (e) { toast('Could not remove the row'); } }
    else { S.socialLocal = S.socialLocal.filter(r => r.id !== id); store.set('wr.social.local', S.socialLocal); rerenderKeep(); }
  }
  async function saveShareUrl() {
    const val = (($('#share-url') || {}).value || '').trim();
    if (val && !/^https:\/\/\S+$/.test(val)) { toast('Use a full link that starts with https://'); return; }
    if (S.db) { try { await S.db.doc('settings/site').set({ shareUrl: val }); toast('Link saved'); } catch (e) { toast('Only editors can change the public link'); } }
    else { S.settings.shareUrl = val; store.set('wr.shareUrl', val); toast('Link saved on this device'); }
  }

  /* ---------- Boot ---------- */
  function openFromHash() {
    const [v, id] = fromHash();
    if (v === 'city') { if (getCity(id)) setCity(id, true); return ['home', null]; }
    return [v, id];
  }
  window.addEventListener('hashchange', () => { const [v, id] = openFromHash(); if (v !== S.view || (id || null) !== S.id || v === 'home') go(v, id, { keepScroll: false }); });
  applyTheme(S.theme);
  if (S.draft && !('cityId' in S.draft)) { S.draft.cityId = cityIdOf(S.draft) || ''; }
  const [v0, id0] = openFromHash();
  S.view = v0 === 'edit' ? 'studio' : v0; S.id = id0 || null;
  adoptCity(S.view, S.id);
  if (v0 === 'edit') loadIntoEditor(id0);
  render();
  track('visit');
  track('pv', S.view);
  initCaps();
  runLoader();
  /* A photo that cannot load (offline, blocked) gives way to the illustration underneath. */
  document.addEventListener('error', e => { const im = e.target; if (im && im.tagName === 'IMG' && im.parentNode && im.parentNode.classList && im.parentNode.classList.contains('photo')) im.parentNode.classList.add('ph-fail'); }, true);
  wantPhotos();
  window.addEventListener('online', () => wantPhotos());

  /* Loader: red → red + yellow → green, then the logo slides out and the page appears */
  function runLoader() {
    const L = document.getElementById('loader');
    const root = document.documentElement;
    const reveal = () => { root.classList.add('loaded'); setTimeout(() => root.classList.add('intro-done'), 1400); };
    if (!L) { reveal(); return; }
    const steps = reduceMotion() ? [[0, '3'], [700, 'done']] : [[120, '1'], [700, '2'], [1250, '3'], [2300, 'done']];
    let finished = false;
    const finish = () => {
      if (finished) return; finished = true;
      L.dataset.s = '3'; L.classList.add('done'); reveal();
      setTimeout(() => { L.remove(); }, 600);
    };
    steps.forEach(([t, s]) => setTimeout(() => { if (finished) return; if (s === 'done') finish(); else L.dataset.s = s; }, t));
    L.addEventListener('click', finish);
    document.addEventListener('keydown', function k(e) { if (e.key === 'Escape' || e.key === 'Enter') { finish(); document.removeEventListener('keydown', k); } });
  }
})();

</script>

</body></html>

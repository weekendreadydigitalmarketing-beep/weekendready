<title>WeekendReady</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ready-made one-day city walks: free PDF guides, short walks, places to eat, events and a route planner for Wrocław, Kraków, Warsaw, Gdańsk, Poznań and Prague.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Overpass+Mono:wght@400;600;700&family=Poppins:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: wayfinding-signage app. Sticky line header, content on map paper, every route drawn as a metro line with trail-marked stops. */
:root {
  --paper: #EEF1EE; --surface: #FFFFFF; --surface-2: #E3E8E4; --ink: #142033; --ink-2: #3E4A60; --muted: #5F6B7E; --line: #CCD4CF;
  --red: #D2232A; --blue: #1D5FB8; --green: #13804A; --yellow: #E3A600; --black: #1C1C1C; --yellow-ink: #1C1C1C; --yellow-text: #8A6300;
  --red-soft: #FBE7E7; --tint: #E8EEF6; --on-accent: #FFFFFF; --focus: #1D5FB8;
  --map-bg: #E5ECE7; --map-grid: #D5DED8; --river: #9CC3D8; --pin-ring: #FFFFFF;
  --good: #13804A; --warn: #A15F00; --chart-1: #1D5FB8; --chart-2: #D2232A; --grid: #E1E6E2;
  --shadow: 0 1px 2px rgba(20, 32, 51, .06), 0 8px 24px rgba(20, 32, 51, .06);
  --display: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --body: 'Poppins', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --prose: 'Literata', Georgia, 'Times New Roman', serif;
  --mono: 'Overpass Mono', ui-monospace, Menlo, Consolas, monospace;
  --r: 10px; --wrap: 1180px;
  --sc-sky:#DCE9F0;--sc-dusk:#3B3F6B;--sc-sun:#F6D271;--sc-sunset:#F09A5B;--sc-ground:#C9D3CB;--sc-cobble:#C5C1B8;--sc-cobbleDusk:#4A4660;--sc-grass:#A9C79A;--sc-water:#8DB9D3;--sc-wave:#C7DFEC;--sc-kerb:#B3AEA3;--sc-wall1:#EAD9B8;--sc-wall2:#E7B9A3;--sc-wall3:#B9D0C2;--sc-wall4:#D7C5E2;--sc-brick:#B4553E;--sc-brickDusk:#6E3A3E;--sc-roof:#5A3A33;--sc-win:#4B5F78;--sc-winDark:#3A475A;--sc-winWarm:#F7C76A;--sc-door:#5A3A33;--sc-clock:#F4EBD3;--sc-ink:#1E2534;--sc-stone:#CFCBC2;--sc-bronze:#8A6A3A;--sc-trunk:#6F553D;--sc-leaf:#5E9B63;--sc-leaf2:#78B27B;--sc-shadow:#7A7A85;--sc-bridge:#2F7B5E;--sc-lamp:#FFE7A3;--sc-glow:#5A5584;--sc-paperLine:#F7F4EC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1520; --surface: #162131; --surface-2: #1E2B3D; --ink: #E7ECF3; --ink-2: #BAC4D2; --muted: #8E9BAE; --line: #2B3A50;
    --red: #EE5A5A; --blue: #4F8FE6; --green: #3CC47F; --yellow: #E9B949; --black: #C8CED8; --yellow-text: #E9B949;
    --red-soft: #3A1E25; --tint: #1A2C46; --on-accent: #170B0C; --focus: #7FB0F5;
    --map-bg: #17253A; --map-grid: #1F2F47; --river: #2C5878; --pin-ring: #0E1520;
    --good: #3CC47F; --warn: #E9B949; --chart-1: #4F8FE6; --chart-2: #EE5A5A; --grid: #22314A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
    --sc-sky:#22344A;--sc-dusk:#3B3F6B;--sc-sun:#E8C15E;--sc-sunset:#F09A5B;--sc-ground:#2E3B3A;--sc-cobble:#3A3A42;--sc-cobbleDusk:#4A4660;--sc-grass:#2F4B35;--sc-water:#244A66;--sc-wave:#3A6A8A;--sc-kerb:#4A4A52;--sc-wall1:#8B7D63;--sc-wall2:#8A6153;--sc-wall3:#5D7468;--sc-wall4:#6F6380;--sc-brick:#8C4535;--sc-brickDusk:#6E3A3E;--sc-roof:#3A2622;--sc-win:#F2C66B;--sc-winDark:#18202C;--sc-winWarm:#F7C76A;--sc-door:#2C1E1A;--sc-clock:#D9CFB3;--sc-ink:#1E2534;--sc-stone:#7E7B76;--sc-bronze:#8A6A3A;--sc-trunk:#6F553D;--sc-leaf:#3F6E45;--sc-leaf2:#4F8455;--sc-shadow:#1F2430;--sc-bridge:#2F7B5E;--sc-lamp:#FFE7A3;--sc-glow:#5A5584;--sc-paperLine:#C9C3B5;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1520; --surface: #162131; --surface-2: #1E2B3D; --ink: #E7ECF3; --ink-2: #BAC4D2; --muted: #8E9BAE; --line: #2B3A50;
  --red: #EE5A5A; --blue: #4F8FE6; --green: #3CC47F; --yellow: #E9B949; --black: #C8CED8; --yellow-text: #E9B949;
  --red-soft: #3A1E25; --tint: #1A2C46; --on-accent: #170B0C; --focus: #7FB0F5;
  --map-bg: #17253A; --map-grid: #1F2F47; --river: #2C5878; --pin-ring: #0E1520;
  --good: #3CC47F; --warn: #E9B949; --chart-1: #4F8FE6; --chart-2: #EE5A5A; --grid: #22314A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
  --sc-sky:#22344A;--sc-dusk:#3B3F6B;--sc-sun:#E8C15E;--sc-sunset:#F09A5B;--sc-ground:#2E3B3A;--sc-cobble:#3A3A42;--sc-cobbleDusk:#4A4660;--sc-grass:#2F4B35;--sc-water:#244A66;--sc-wave:#3A6A8A;--sc-kerb:#4A4A52;--sc-wall1:#8B7D63;--sc-wall2:#8A6153;--sc-wall3:#5D7468;--sc-wall4:#6F6380;--sc-brick:#8C4535;--sc-brickDusk:#6E3A3E;--sc-roof:#3A2622;--sc-win:#F2C66B;--sc-winDark:#18202C;--sc-winWarm:#F7C76A;--sc-door:#2C1E1A;--sc-clock:#D9CFB3;--sc-ink:#1E2534;--sc-stone:#7E7B76;--sc-bronze:#8A6A3A;--sc-trunk:#6F553D;--sc-leaf:#3F6E45;--sc-leaf2:#4F8455;--sc-shadow:#1F2430;--sc-bridge:#2F7B5E;--sc-lamp:#FFE7A3;--sc-glow:#5A5584;--sc-paperLine:#C9C3B5;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.55 var(--body); margin: 0; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.wrap { max-width: var(--wrap); margin: 0 auto; padding-left: max(16px, 3vw, env(safe-area-inset-left, 0px)); padding-right: max(16px, 3vw, env(safe-area-inset-right, 0px)); }
[hidden] { display: none !important; }
.eyebrow { font: 700 12px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Trail mark: white–colour–white, like Polish hiking signs */
.tm { display: inline-block; flex: none; width: 24px; height: 15px; border: 1px solid var(--line); background: linear-gradient(#fff 0 33%, var(--trail, var(--red)) 33% 67%, #fff 67%); border-radius: 2px; vertical-align: -2px; }
.tm.lg { width: 34px; height: 21px; }

/* Header */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--paper) 90%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .hdr { display: flex; align-items: center; gap: 14px; min-height: 62px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 800 19px/1 var(--display); letter-spacing: -0.02em; white-space: nowrap; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); flex: none; }
.navrow { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
.nav { display: flex; gap: 2px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button { background: none; border: 0; padding: 8px 11px; border-radius: 999px; font-weight: 600; font-size: 14.5px; color: var(--ink-2); cursor: pointer; white-space: nowrap; font-family: var(--body); }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--ink); color: var(--paper); }
.nav .internal { margin-left: auto; }
.hdr-act { display: flex; align-items: center; gap: 8px; flex: none; }
.top .cta { white-space: nowrap; }
.city-wrap { position: relative; flex: none; }
.city-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 38px; padding: 6px 10px 6px 8px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 700 14.5px/1 var(--body); cursor: pointer; white-space: nowrap; }
.city-chip:hover { border-color: var(--ink); }
.city-chip .icon { width: 16px; height: 16px; color: var(--muted); }
.city-chip .cn { max-width: 9.5em; overflow: hidden; text-overflow: ellipsis; }
.city-chip.hint { box-shadow: 0 0 0 4px color-mix(in srgb, var(--trail) 22%, transparent); }
.city-pop { position: absolute; left: 0; top: calc(100% + 8px); z-index: 40; width: min(320px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; }
.cp-list { display: grid; gap: 4px; margin-top: 10px; }
.cp-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 9px 10px; border-radius: 10px; border: 0; background: none; color: var(--ink); cursor: pointer; font: inherit; }
.cp-item:hover, .cp-item:focus-visible { background: var(--surface-2); }
.cp-item.on { background: color-mix(in srgb, var(--trail) 10%, var(--surface)); }
.cp-item .cp-tx { display: grid; flex: 1; min-width: 0; }
.cp-item b { font-size: 15.5px; } .cp-item small { color: var(--muted); font-size: 12.5px; }
.cp-item .icon { color: var(--trail-text, var(--trail)); }
.saved-btn { position: relative; width: 40px; height: 40px; border-radius: 999px; }
.saved-btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.saved-btn .badge { position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px; background: var(--red); color: var(--on-accent); font: 700 11px/19px var(--body); text-align: center; }
@media (max-width: 1080px) { .nav .internal { margin-left: 0; } }
@media (max-width: 860px) {
  .top .hdr { flex-wrap: wrap; gap: 8px 10px; padding-block: 10px 8px; }
  .hdr-act { margin-left: auto; }
  .navrow { order: 3; flex-basis: 100%; }
}
@media (max-width: 560px) { .top .cta .cta-l { display: none; } .top .cta { padding-inline: 11px; } }

/* Buttons and chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; transition: transform .12s ease, background .12s ease; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--red); border-color: var(--red); color: var(--on-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--red) 88%, var(--ink)); }
.btn-dark { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn-dark:hover { background: color-mix(in srgb, var(--ink) 85%, var(--paper)); }
.btn-sm { min-height: 36px; padding: 6px 13px; font-size: 14px; }
.btn-ghost { border-color: var(--line); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn svg, .icon { width: 18px; height: 18px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.red { background: var(--red-soft); color: var(--red); }
.chip.blue { background: var(--tint); color: var(--blue); }
.chip.good { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.chip.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Sections */
main { padding-block: 0 72px; min-height: 60vh; }
section.block { padding-block: 56px 0; }
.sec-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.sec-head h2 { font-size: clamp(26px, 3.4vw, 38px); font-weight: 800; letter-spacing: -0.015em; }
.sec-head p { color: var(--muted); max-width: 60ch; margin-top: 8px; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; min-width: 0; }

/* Scenes */
.scene { display: block; width: 100%; height: 100%; }
.pic { position: relative; overflow: hidden; background: var(--sc-sky); aspect-ratio: 16 / 10; max-width: 100%; }

/* Hero */
.hero { padding-block: 44px 8px; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 40px; align-items: center; }
.hero h1 { font-size: clamp(42px, 7vw, 86px); font-weight: 800; letter-spacing: -0.03em; line-height: .98; margin-top: 16px; }
.hero h1 em { font-style: normal; color: var(--red); }
.hero .lead { font-size: clamp(18px, 1.6vw, 21px); color: var(--ink-2); margin-top: 20px; max-width: 34ch; }
.hero .row { margin-top: 26px; }
.hero .facts { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 6px 18px; font: 600 14px/1.4 var(--mono); color: var(--muted); }
.ticket { position: relative; }
.ticket .pic { border-radius: 14px; aspect-ratio: 4 / 3; box-shadow: var(--shadow); }
.ticket .stub { position: absolute; right: -10px; bottom: -26px; width: min(300px, 78%); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow); }
.ticket .stub h3 { font-size: 15px; font-weight: 800; display: flex; gap: 8px; align-items: center; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: 28px; } .ticket .stub { position: relative; right: auto; bottom: auto; width: auto; margin: -48px 12px 0; } }

/* Metro line: compact vertical list */
.mline { list-style: none; margin: 12px 0 0; padding: 0; position: relative; }
.mline::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 3px; background: var(--trail, var(--red)); border-radius: 2px; }
.mline li { position: relative; display: flex; justify-content: space-between; gap: 10px; padding: 3px 0 3px 24px; font-size: 13.5px; }
.mline li::before { content: ""; position: absolute; left: 0; top: 7px; width: 15px; height: 15px; border-radius: 50%; background: var(--surface); border: 3px solid var(--trail, var(--red)); }
.mline li span:last-child { font-family: var(--mono); color: var(--muted); }
.mline li.more { color: var(--muted); }

/* Metro line: horizontal overview */
.hline-wrap { overflow-x: auto; padding-bottom: 6px; }
.hline { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, 1fr); min-width: 900px; position: relative; padding-top: 4px; }
.hline::before { content: ""; position: absolute; left: 30px; right: 30px; top: 46px; height: 5px; background: var(--trail, var(--red)); border-radius: 3px; }
.hstop { position: relative; text-align: center; padding: 0 6px; background: none; border: 0; cursor: pointer; color: var(--ink); }
.hstop .t { font: 700 13px/1 var(--mono); color: var(--muted); }
.hstop .dot { width: 26px; height: 26px; margin: 12px auto 10px; border-radius: 50%; background: var(--surface); border: 5px solid var(--trail, var(--red)); position: relative; z-index: 1; display: grid; place-items: center; font: 800 11px/1 var(--display); }
.hstop .n { font-weight: 700; font-size: 14px; line-height: 1.25; }
.hstop .w { font-size: 12px; color: var(--muted); margin-top: 4px; }
.hstop:hover .dot { background: var(--trail, var(--red)); }

/* Features */
.feat { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 0; border-top: 2px solid var(--ink); }
.feat > div { padding: 20px 20px 22px 0; border-bottom: 1px solid var(--line); }
.feat h3 { font-size: 19px; font-weight: 800; margin: 10px 0 6px; }
.feat p { color: var(--ink-2); font-size: 15px; }
.feat svg { width: 28px; height: 28px; color: var(--red); }

/* Trip cards */
.tcard { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-align: left; padding: 0; cursor: pointer; color: var(--ink); transition: transform .15s ease, box-shadow .15s ease; min-width: 0; }
.tcard:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.tcard .pic { aspect-ratio: 16 / 9; border-bottom: 4px solid var(--trail, var(--red)); }
.tcard .bd { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.tcard h3 { font-size: 21px; font-weight: 800; }
.tcard .meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 600 13px/1.4 var(--mono); color: var(--muted); margin-top: auto; padding-top: 6px; }
.tcard .tag { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.tcard p { font-size: 15px; color: var(--ink-2); }
.tcard.new { border-style: dashed; border-width: 2px; background: transparent; align-items: flex-start; justify-content: center; padding: 26px; gap: 10px; min-height: 260px; }
.tcard.new .plus { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font: 800 26px/1 var(--display); }

/* Trip page */
.trip-hero { position: relative; margin-top: 20px; border-radius: 14px; overflow: hidden; }
.trip-hero .pic { aspect-ratio: auto; height: clamp(180px, 26vw, 300px); }
.trip-hero .band { height: 6px; background: var(--trail); }
.trip-head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; margin-top: 24px; }
.trip-head h1 { font-size: clamp(36px, 5.4vw, 64px); font-weight: 900; letter-spacing: -0.03em; }
.trip-head .tagline { font-size: 19px; color: var(--ink-2); margin-top: 10px; max-width: 52ch; }
@media (max-width: 760px) { .trip-head { grid-template-columns: 1fr; } }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid var(--line); margin-top: 24px; }
.stats > div { padding: 14px 12px 14px 0; }
.stats b { display: block; font: 800 clamp(20px, 2.4vw, 28px)/1.1 var(--display); margin-top: 6px; font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
.trip-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 34px; margin-top: 34px; align-items: start; }
.trip-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); display: grid; gap: 18px; }
@media (max-width: 900px) { .trip-body { grid-template-columns: 1fr; } .trip-side { position: static; order: -1; } }
.intro { font-size: 17.5px; line-height: 1.65; color: var(--ink-2); max-width: 62ch; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 15px; margin-top: 18px; }
.kv dt { font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; padding-top: 3px; }
.kv dd { margin: 0; }

/* Timeline */
.tl { list-style: none; padding: 0; margin: 26px 0 0; }
.tl > li { position: relative; padding-left: 52px; }
.tl .num { position: absolute; left: -52px; top: -4px; width: 38px; height: 38px; border-radius: 50%; background: var(--trail); color: var(--trail-ink, var(--on-accent)); display: grid; place-items: center; font: 900 16px/1 var(--display); border: 4px solid var(--paper); z-index: 1; }
.tl .walk { position: relative; padding: 14px 0 20px; font: 600 13px/1.4 var(--mono); color: var(--muted); }
.tl .walk::before, .stop::before { content: ""; position: absolute; left: -35px; width: 4px; background: var(--trail); }
.tl .walk::before { top: 0; bottom: 0; background: repeating-linear-gradient(var(--trail) 0 6px, transparent 6px 11px); }
.stop::before { top: 14px; bottom: 0; }
.tl > li:last-child .stop::before { display: none; }
.stop { position: relative; padding-bottom: 8px; scroll-margin-top: 90px; }
.stop.hl h3 { color: var(--red); }
.stop .when { font: 600 13px/1.4 var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.stop h3 { font-size: 24px; font-weight: 800; margin: 6px 0 10px; }
.stop .pic { border-radius: 10px; aspect-ratio: 16 / 7; margin-bottom: 12px; }
.stop .desc { font-size: 16.5px; line-height: 1.65; max-width: 62ch; }
.tip { margin-top: 12px; background: color-mix(in srgb, var(--trail) 11%, var(--surface)); border-radius: 8px; padding: 10px 14px; font-size: 15px; display: flex; gap: 10px; }
.tip b { color: var(--trail-text, var(--trail)); font-size: 12px; letter-spacing: .1em; padding-top: 2px; }
.shots { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; color: var(--ink-2); }
.shots .s { display: flex; gap: 6px; align-items: baseline; }
.shots .s b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Map */
.mapbox { background: var(--map-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.mapbox svg { display: block; width: 100%; height: auto; }
.mapbox .cap { display: flex; justify-content: space-between; gap: 10px; padding: 8px 12px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); background: var(--surface); }
.pin { cursor: pointer; }
.pin circle { fill: var(--trail); stroke: var(--pin-ring); stroke-width: 3; transition: r .15s ease; }
.pin text { fill: var(--trail-ink, var(--on-accent)); font: 800 12px var(--display); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.pin:hover circle, .pin.hl circle { stroke: var(--ink); }

/* Banner */
.banner { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 18px 22px; margin-top: 22px; }
.banner p { color: color-mix(in srgb, var(--paper) 80%, transparent); font-size: 15px; }
.banner h3 { font-size: 20px; font-weight: 800; }
.banner .btn { border-color: var(--paper); color: var(--paper); }
.banner .btn-primary { background: var(--red); border-color: var(--red); color: var(--on-accent); }

/* Blog */
.pcard { display: flex; flex-direction: column; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); min-width: 0; }
.pcard .pic { border-radius: 10px; aspect-ratio: 16 / 10; }
.pcard .cat { margin-top: 14px; }
.pcard h3 { font-size: 22px; font-weight: 800; margin-top: 6px; }
.pcard p { color: var(--ink-2); font-size: 15px; margin-top: 8px; }
.pcard:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.pcard.feature { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.pcard.feature h3 { font-size: clamp(26px, 3.2vw, 38px); font-weight: 900; }
@media (max-width: 760px) { .pcard.feature { grid-template-columns: 1fr; gap: 0; } }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
.article { max-width: 720px; margin: 0 auto; }
.article .pic { border-radius: 14px; aspect-ratio: 16 / 8; margin-top: 22px; }
.article h1 { font-size: clamp(34px, 5vw, 54px); font-weight: 900; letter-spacing: -0.025em; margin-top: 14px; }
.article .byline { margin-top: 14px; font: 600 14px/1.4 var(--mono); color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.prose { font-family: var(--prose); font-size: 19px; line-height: 1.7; margin-top: 26px; }
.prose > * + * { margin-top: 18px; }
.prose h2 { font-family: var(--display); font-size: 24px; font-weight: 800; margin-top: 32px; }
.prose ul { padding-left: 22px; }
.prose li + li { margin-top: 8px; }
.route-snip { font-family: var(--body); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 18px; --trail: var(--red); }
.route-snip .eyebrow { margin-bottom: 4px; display: block; }
.sharebar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line); }

/* Share menu */
.share-pop { position: fixed; z-index: 60; inset: auto 16px calc(16px + env(safe-area-inset-bottom, 0px)) auto; width: min(340px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; }
.share-pop h3 { font-size: 18px; font-weight: 800; }
.share-pop .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.share-pop .opts a, .share-pop .opts button { justify-content: flex-start; }
.share-pop input { width: 100%; margin-top: 12px; }

/* Forms */
.field { display: grid; gap: 6px; min-width: 0; align-content: start; }
.field > span { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.field small { color: var(--muted); font-size: 12.5px; }
input[type="text"], input[type="number"], input[type="time"], input[type="url"], input[type="date"], select, textarea {
  width: 100%; min-width: 0; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); font-size: 15px;
}
input:focus, select:focus, textarea:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent); }
textarea { resize: vertical; min-height: 84px; line-height: 1.5; }
.fgrid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.fgrid .wide { grid-column: 1 / -1; }

/* Studio */
.studio { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 26px; align-items: start; margin-top: 24px; }
.studio .preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 80px); display: grid; gap: 14px; }
@media (max-width: 980px) { .studio { grid-template-columns: 1fr; } .studio .preview { position: static; } }
.stop-ed { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 16px; display: grid; gap: 12px; border-left: 5px solid var(--trail); }
.stop-ed .hd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stop-ed .hd b { font: 900 18px/1 var(--display); color: var(--trail-text, var(--trail)); min-width: 22px; }
.stop-ed .hd .sp { flex: 1; }
.icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn[disabled] { opacity: .35; cursor: not-allowed; }
.trail-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.trail-pick label { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 14px; font-weight: 600; }
.trail-pick input { position: absolute; opacity: 0; pointer-events: none; }
.trail-pick input:checked + .tm + span { text-decoration: underline; text-underline-offset: 3px; }
.trail-pick label:has(input:checked) { border-color: var(--ink); background: var(--surface-2); }
.trail-pick label:has(input:focus-visible) { outline: 3px solid var(--focus); }
.my-trips { display: grid; gap: 8px; }
.my-trip { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.my-trip .t { flex: 1; min-width: 0; }
.my-trip .t b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.my-trip .t small { color: var(--muted); }
.notice { border-radius: 10px; padding: 12px 14px; font-size: 14.5px; background: var(--tint); color: var(--ink); display: flex; gap: 10px; align-items: flex-start; }
.notice.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); }
.errors { color: var(--red); font-weight: 600; font-size: 14.5px; }
.confirm { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 6px 10px; border-radius: 999px; background: var(--red-soft); color: var(--red); font-weight: 700; font-size: 14px; }

/* Dashboard */
.kpis { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
.kpi .spark-gap { display: block; height: 38px; margin-top: 4px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px 12px; display: grid; gap: 4px; min-width: 0; }
.kpi .v { font: 900 34px/1.05 var(--display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.kpi .lbl { font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
.kpi .sub { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.kpi svg { width: 100%; height: 38px; display: block; margin-top: 4px; }
.bar-track { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar-track i { display: block; height: 100%; background: var(--good); border-radius: 3px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { fill: var(--muted); font: 500 11px var(--mono); }
.chart .tt { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); padding: 8px 10px; border-radius: 8px; font-size: 13px; white-space: nowrap; transform: translate(-50%, -110%); }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); margin-bottom: 10px; }
.legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.hbars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 4px 10px; align-items: center; font-size: 14px; }
.hbar .bt { grid-column: 1 / -1; height: 10px; border-radius: 0 5px 5px 0; background: var(--surface-2); overflow: hidden; }
.hbar .bt i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
.hbar .n { text-align: right; font: 700 14px var(--mono); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
th { text-align: left; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.switch input { width: 38px; height: 22px; appearance: none; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.switch input:checked { background: var(--blue); }
.switch input:checked::after { transform: translateX(16px); }

/* Concept */
.concept { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 40px; margin-top: 30px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 84px); display: grid; gap: 2px; font-size: 14px; }
.toc button { text-align: left; background: none; border: 0; padding: 6px 10px; border-left: 3px solid var(--line); cursor: pointer; color: var(--ink-2); }
.toc button:hover { border-left-color: var(--red); color: var(--ink); }
@media (max-width: 900px) { .concept { grid-template-columns: minmax(0, 1fr); } .toc { display: none; } }
.csec { padding-bottom: 40px; margin-bottom: 40px; border-bottom: 1px solid var(--line); scroll-margin-top: 90px; }
.csec:last-child { border-bottom: 0; }
.csec > .eyebrow { color: var(--red); }
.csec h2 { font-size: clamp(26px, 3vw, 34px); font-weight: 900; margin: 8px 0 14px; }
.csec h3 { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
.csec p, .csec li { color: var(--ink-2); max-width: 70ch; }
.csec p + p { margin-top: 12px; }
.csec ul, .csec ol { padding-left: 20px; margin: 10px 0 0; }
.csec li + li { margin-top: 6px; }
.oneliner { font: 800 clamp(22px, 2.6vw, 30px)/1.25 var(--display); letter-spacing: -0.015em; max-width: 30ch; color: var(--ink); }
.persona { display: grid; gap: 8px; }
.persona .who { display: flex; gap: 12px; align-items: center; }
.persona .av { width: 46px; height: 46px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font: 900 18px/1 var(--display); color: var(--ink); flex: none; }
.funnel svg { width: 100%; height: auto; display: block; }
.funnel text { font-family: var(--body); }
.weeks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 0; border-top: 4px solid var(--red); }
.weeks > div { padding: 16px 16px 16px 0; position: relative; }
.weeks > div::before { content: ""; position: absolute; top: -12px; left: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); border: 4px solid var(--red); }
.weeks h3 { margin-top: 6px; }

/* Footer, toast, modal */
footer.site { border-top: 1px solid var(--line); padding-block: 34px 44px; color: var(--muted); font-size: 14px; }
footer.site .wrap { display: grid; grid-template-columns: minmax(0, 1.6fr) repeat(3, minmax(0, 1fr)); gap: 28px 36px; }
footer.site .privacy { margin-top: 10px; max-width: 54ch; font-size: 13px; color: var(--muted); }
.f-col { display: grid; align-content: start; gap: 12px; min-width: 0; }
.f-links { display: grid; gap: 6px; justify-items: start; }
.f-links button { background: none; border: 0; padding: 2px 0; color: var(--ink-2); font: 600 14.5px/1.4 var(--body); cursor: pointer; text-align: left; }
.f-links button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 860px) { footer.site .wrap { grid-template-columns: repeat(2, minmax(0, 1fr)); } .f-brand { grid-column: 1 / -1; } }
@media (max-width: 420px) { footer.site .wrap { grid-template-columns: 1fr; } }
footer.site .brand { color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 12px 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14.5px; z-index: 80; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; display: flex; align-items: center; gap: 12px; }
.toast-btn { background: transparent; color: var(--paper); border: 1.5px solid color-mix(in srgb, var(--paper) 55%, transparent); border-radius: 999px; padding: 5px 12px; font: 700 13.5px/1 var(--body); cursor: pointer; }
.modal { position: fixed; inset: 0; z-index: 70; background: rgba(8, 12, 20, .72); display: grid; place-items: center; padding: 16px; }
.story { position: relative; width: min(380px, 100%); aspect-ratio: 9 / 16; max-height: 86vh; border-radius: 18px; overflow: hidden; background: #000; color: #fff; }
.story .pic { position: absolute; inset: 0; aspect-ratio: auto; height: 100%; }
.story .pic svg { animation: kb 15s linear forwards; transform-origin: 60% 50%; }
@keyframes kb { from { transform: scale(1.05) translateX(0); } to { transform: scale(1.4) translateX(-6%); } }
.story .bars { position: absolute; top: 12px; left: 12px; right: 12px; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; overflow: hidden; }
.story .bars i { display: block; height: 100%; width: 0; background: #fff; animation: prog 15s linear forwards; }
@keyframes prog { to { width: 100%; } }
.story .cap { position: absolute; left: 16px; right: 16px; bottom: 22px; font: 800 24px/1.15 var(--display); text-shadow: 0 2px 12px rgba(0,0,0,.6); }
.story .cap small { display: block; font: 600 13px/1.3 var(--body); margin-top: 8px; opacity: .9; }
.story .lbl { position: absolute; top: 24px; left: 16px; right: 56px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
.story .x { position: absolute; top: 18px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font-size: 20px; cursor: pointer; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

.logo-ic { flex: none; border-radius: 8px; }

/* ---------- Brand animation ---------- */
.brand .wm { display: inline-block; overflow: hidden; padding: 2px 0; }
.brand .wm-in { display: inline-block; }
.brand .wm-r { color: var(--red); }
.brand .logo-ic { overflow: visible; }
.brand .ic-dot { transform-box: fill-box; transform-origin: center; }
.brand:hover .ic-dash, .brand:focus-visible .ic-dash { animation: ic-dash .9s linear infinite; }
.brand:hover .ic-dot, .brand:focus-visible .ic-dot { animation: ic-pop .9s ease-in-out infinite; }
.brand:hover .ic-dot.d2 { animation-delay: .15s; } .brand:hover .ic-dot.d3 { animation-delay: .3s; }
@keyframes ic-dash { to { stroke-dashoffset: -13.6; } }
@keyframes ic-pop { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.35); } }
html.loaded:not(.intro-done) header.top .brand .logo-ic { animation: ic-in .7s cubic-bezier(.2, .8, .2, 1) both; }
html.loaded:not(.intro-done) header.top .brand .wm-in { animation: wm-out .75s .3s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes ic-in { from { transform: translateX(-28px) rotate(-90deg) scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wm-out { from { transform: translateX(-104%); } to { transform: none; } }

/* ---------- Loader: traffic light ---------- */
.loader { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: var(--paper); transition: opacity .5s ease, visibility .5s; animation: ld-fail 0s 6s forwards; cursor: pointer; }
.loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
@keyframes ld-fail { to { opacity: 0; visibility: hidden; pointer-events: none; } }
.ld-stage { display: flex; align-items: center; padding-bottom: 40px; }
.ld-light { position: relative; display: grid; gap: 10px; padding: 14px 12px; border-radius: 24px; background: #142033; border: 2px solid rgba(255, 255, 255, .08); box-shadow: 0 20px 44px rgba(20, 32, 51, .28); flex: none; }
.ld-light::after { content: ""; position: absolute; left: 50%; top: 100%; width: 12px; height: 48px; margin-left: -6px; background: #142033; border-radius: 0 0 4px 4px; }
.ld-light i { width: 46px; height: 46px; border-radius: 50%; background: #26324A; box-shadow: inset 0 3px 6px rgba(0, 0, 0, .35); transition: background .2s, box-shadow .2s; }
.loader[data-s="1"] .l-r, .loader[data-s="2"] .l-r { background: #FF3B3B; box-shadow: 0 0 26px 6px rgba(255, 59, 59, .55), inset 0 -4px 8px rgba(0, 0, 0, .2); }
.loader[data-s="2"] .l-y { background: #FFC21A; box-shadow: 0 0 26px 6px rgba(255, 194, 26, .5), inset 0 -4px 8px rgba(0, 0, 0, .2); }
.loader[data-s="3"] .l-g { background: #22D07F; box-shadow: 0 0 30px 8px rgba(34, 208, 127, .5), inset 0 -4px 8px rgba(0, 0, 0, .2); }
.ld-logo { display: flex; align-items: center; gap: 14px; max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; font: 900 clamp(26px, 6vw, 40px)/1 var(--display); letter-spacing: -0.02em; color: var(--ink);
  transition: max-width .7s cubic-bezier(.2, .8, .2, 1), opacity .3s, margin .7s cubic-bezier(.2, .8, .2, 1); }
.ld-logo svg { flex: none; width: clamp(44px, 10vw, 60px); height: auto; }
.ld-logo .wm-r { color: var(--red); }
.loader[data-s="3"] .ld-logo { max-width: 520px; opacity: 1; margin-left: 26px; }
.ld-skip { position: absolute; bottom: 22px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--muted); }
html.booting #app { opacity: 0; transform: translateY(14px); animation: app-fail 0s 6s forwards; }
html.booting.loaded #app { opacity: 1; transform: none; animation: none; transition: opacity .6s ease, transform .6s cubic-bezier(.2, .8, .2, 1); }
@keyframes app-fail { to { opacity: 1; transform: none; } }

/* ---------- Meal options ---------- */
.chip.green { background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
.meals { margin-top: 14px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; }
.meals .mh { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.meals .mh .eyebrow { display: inline-flex; align-items: center; gap: 6px; color: var(--trail-text, var(--trail)); }
.meals .mh .eyebrow .icon { width: 15px; height: 15px; }
.meal-list { display: grid; gap: 8px; }
.meal { border: 1px solid var(--line); border-radius: 10px; background: var(--paper); overflow: hidden; }
.meal.on { border-color: var(--trail); box-shadow: 0 0 0 1px var(--trail); background: color-mix(in srgb, var(--trail) 7%, var(--surface)); }
.meal-pick { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; padding: 11px 12px; cursor: pointer; color: inherit; font: inherit; }
.meal-pick .radio { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); display: grid; place-items: center; }
.meal.on .meal-pick .radio { border-color: var(--trail); }
.meal.on .meal-pick .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--trail); }
.meal-pick .mt { flex: 1; min-width: 0; display: grid; }
.meal-pick .mt b { font-size: 16px; }
.meal-pick .mt small { color: var(--muted); font-size: 13.5px; }
.meal-pick .mm { flex: none; font-size: 12.5px; color: var(--muted); }
.meal .md { padding: 0 12px 12px 42px; display: grid; gap: 6px; font-size: 14.5px; }
.meal .md .addr { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); }
.meal .md .addr .icon { width: 15px; height: 15px; flex: none; }
.meal .md p { margin: 0; color: var(--ink-2); }
.meal .md .btn { justify-self: start; }
.meal:not(.on) .md p, .meal:not(.on) .md .btn { display: none; }

/* ---------- Place library ---------- */
.lib .sec-head { align-items: flex-end; }
.lib-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-top: 14px; max-height: 430px; overflow: auto; padding: 2px; }
.lib-item { display: flex; gap: 10px; text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; color: inherit; font: inherit; transition: border-color .15s, transform .15s; }
.lib-item:hover { border-color: var(--trail); transform: translateY(-1px); }
.lib-item.added { border-color: var(--trail); background: color-mix(in srgb, var(--trail) 8%, var(--surface)); }
.lib-ic { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--trail); color: var(--trail-ink, var(--on-accent)); display: grid; place-items: center; font: 800 16px/1 var(--display); }

.lib-tx small { color: var(--muted); font-size: 12.5px; font-weight: 600; }
.lib-tx span { font-size: 13.5px; color: var(--ink-2); line-height: 1.4; }

/* ---------- Create your own route (home) ---------- */
.create-in { display: grid; grid-template-columns: 1.1fr 1fr; gap: 32px; align-items: center; background: var(--ink); color: var(--paper); border-radius: 18px; padding: clamp(22px, 4vw, 44px); }
.create-in h2 { font-size: clamp(30px, 4vw, 44px); color: var(--paper); margin-top: 8px; }
.create-in p { color: color-mix(in srgb, var(--paper) 82%, transparent); margin-top: 10px; max-width: 46ch; }
.create-in .eyebrow { color: var(--yellow); }
.create-in .btn:not(.btn-primary) { background: transparent; color: var(--paper); border-color: color-mix(in srgb, var(--paper) 40%, transparent); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: st; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 40px 1fr; gap: 2px 14px; background: color-mix(in srgb, var(--paper) 8%, transparent); border-radius: 12px; padding: 14px 16px; }
.steps li::before { content: counter(st); grid-row: span 2; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 900 16px/1 var(--display); color: #fff; }
.steps li:nth-child(1)::before { background: var(--green); } .steps li:nth-child(2)::before { background: var(--yellow); color: #142033; } .steps li:nth-child(3)::before { background: var(--red); }

/* ---------- Events ---------- */
.event { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }

.ev-hl { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; }
.event:not(.big) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
@media (max-width: 760px) { .event, .event:not(.big) { grid-template-columns: 1fr; } .event .ev-pic { aspect-ratio: 16 / 9; height: auto; min-height: 0; } }

.pick { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); border-left: 4px solid var(--trail); background: var(--surface); color: var(--ink); text-align: left; cursor: pointer; font: inherit; min-width: 0; }

/* WeekendReady — more cities.
   Each city lists its places once (with coordinates); routes point at places by name, so a coordinate
   lives in one place only. Facts, coordinates, places to eat and event dates were checked on 17 Oct 2026
   against Wikipedia, OpenStreetMap, official city and tourism sites, venue sites and organisers. */
function WR_ADD_CITY(city, build) {
  const at = name => {
    const p = city.places.find(x => x.name === name) || city.places.find(x => x.name.startsWith(name));
    if (!p) throw new Error('Unknown place for ' + city.id + ': ' + name);
    return p;
  };
  const tag = city.id.slice(0, 2);
  const api = {
    /* stop(i, 'Place name', { stay, desc, tip, photo, video, name?, type? }) */
    stop: (i, name, o) => { const p = at(name); return Object.assign({ id: tag + (i + 1), name: p.name, type: p.type, lat: p.lat, lng: p.lng, stay: p.stay, desc: p.desc, tip: '', photo: '', video: '', wiki: p.wiki || '' }, o || {}); },
    lunch: (i, o) => Object.assign({ id: tag + 'l' + (i + 1), name: 'Lunch stop: ' + city.lunchHub.name, type: 'meal', lat: city.lunchHub.lat, lng: city.lunchHub.lng, stay: 60,
      desc: 'Time to eat. Pick one of the places below; walking times are from this stop.', tip: 'Opening hours change by day and season. Check your pick before you walk over.', photo: '', video: '', meals: city.meals }, o || {})
  };
  WR_CITIES.push(city);
  const out = build(api);
  (out.trips || []).forEach(t => WR_BUILTIN_TRIPS.push(Object.assign({ cityId: city.id, city: city.name, water: city.water }, t)));
  (out.events || []).forEach(e => WR_EVENTS.push(Object.assign({ cityId: city.id }, e)));
  (out.posts || []).forEach(p => WR_POSTS.push(Object.assign({ city: city.id }, p)));
}

/* WeekendReady core: route maths, timing, map projection, links */

      const n = Math.max(stops.length, 1);
      const pts = stops.map((s, i) => {

  function toSVG(type, seed, accent, cls) {
    const prims = scene(type, seed);
    const col = f => f === 'accent' ? (accent || 'var(--trail)') : 'var(--sc-' + f + ')';
    let s = '<svg class="' + (cls || 'scene') + '" viewBox="0 0 320 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true" focusable="false">';
    for (const p of prims) {
      if (p.t === 'r') s += '<rect x="' + p.x + '" y="' + p.y + '" width="' + p.w + '" height="' + p.h + '" fill="' + col(p.f) + '"/>';
      else if (p.t === 'c') s += '<circle cx="' + p.x + '" cy="' + p.y + '" r="' + p.r + '" fill="' + col(p.f) + '"/>';
      else if (p.t === 'p') s += '<polygon points="' + p.pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ') + '" fill="' + col(p.f) + '"/>';
      else if (p.t === 'l') s += '<line x1="' + p.x1 + '" y1="' + p.y1 + '" x2="' + p.x2 + '" y2="' + p.y2 + '" stroke="' + col(p.f) + '" stroke-width="' + p.w + '"/>';
    }
    return s + '</svg>';

  /* ---------- Photos ----------
     Every place can name an English Wikipedia article (`wiki`). When the app runs as a file and is online, it asks
     the Wikipedia API for each article's freely licensed lead photo (Wikimedia Commons), with author and licence,
     and caches the answer for two weeks. "Save a copy with photos" builds the same photos into a new HTML file as
     data, so that copy shows them offline too. Inside the claude.ai viewer, outside images are blocked, so the
     illustrations stay unless a copy with built-in photos is published. */
  /* The page as it was before the app ran (minus any built-in photos), used to write the copy with photos. */
  const PRISTINE = (() => {
    try {
      if (inViewer()) return '';
      const root = document.documentElement.cloneNode(true);
      const old = root.querySelector('#wr-photo-pack'); if (old) old.remove();
      root.classList.remove('booting'); if (!root.classList.length) root.removeAttribute('class');
      root.removeAttribute('data-theme');
      return '<!doctype html>\n' + root.outerHTML;
    } catch (e) { return ''; }
  })();
  const PHOTO_KEY = 'wr.photos.v1', PHOTO_TTL = 14 * 864e5;
  const PH = (() => { const c = store.get(PHOTO_KEY, null); return c && c.items && Date.now() - (c.t || 0) < PHOTO_TTL ? c.items : {}; })();
  const PACK = (() => {
    try { const el = document.getElementById('wr-photo-pack'); const j = el ? JSON.parse(el.textContent) : null; return j && j.photos ? j.photos : {}; } catch (e) { return {}; }
  })();
  const PACK_DATE = (() => { try { const el = document.getElementById('wr-photo-pack'); return el ? (JSON.parse(el.textContent).made || '') : ''; } catch (e) { return ''; } })();
  const photoAsked = new Set();
  const canFetchPhotos = () => !inViewer() && typeof fetch === 'function' && navigator.onLine !== false && /^(https?|file):$/.test(location.protocol);
  const isData = s => /^data:image\/(jpeg|png|webp);base64,/.test(s || '');

  /* The photo to show for an article title, or null (then the illustration stays). */
  function photoOf(title) {
    if (!title) return null;
    const p = PACK[title];
    if (p && isData(p.ds)) return { s: p.ds, l: isData(p.dl) ? p.dl : p.ds, by: p.by, lic: p.lic, licUrl: p.licUrl, page: p.page, local: true };
    const e = PH[title];
    return e && e.s && canFetchPhotos() ? e : null;
  }
  const photoCount = () => new Set(Object.keys(PACK).filter(k => PACK[k] && isData(PACK[k].ds)).concat(Object.keys(PH).filter(k => PH[k] && PH[k].s))).size;

  /* Article for a stop: its own, or the nearest library place within 160 m (meal and market stops keep the illustration). */
  function wikiFor(t, s) {
    if (!s || s.type === 'meal' || s.type === 'xmas' || (s.meals && s.meals.length)) return '';
    if (s.wiki) return s.wiki;
    const city = getCity(cityIdOf(t));
    if (!city || !C.hasCoord(s)) return '';
    let best = '', bd = 160;
    city.places.forEach(p => { if (p.wiki) { const d = C.hav(p, s); if (d < bd) { bd = d; best = p.wiki; } } });
    return best;
  }
  function tripPhotoTitle(t) {
    for (const s of (t && t.stops) || []) { const w = wikiFor(t, s); if (w && photoOf(w)) return w; }
    const c = getCity(cityIdOf(t));
    return c && c.photo ? c.photo : '';
  }

  const WIKI_API = 'https://en.wikipedia.org/w/api.php';
  async function wikiApi(params) {
    const q = new URLSearchParams(Object.assign({ action: 'query', format: 'json', formatversion: '2', origin: '*' }, params));
    const r = await fetch(WIKI_API + '?' + q.toString(), { credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (!r.ok) throw new Error('Wikipedia API ' + r.status);
    return r.json();
  }
  function resolveTitle(q, t) {
    let x = t;
    (q.normalized || []).forEach(n => { if (n.from === x) x = n.to; });
    (q.redirects || []).forEach(n => { if (n.from === x) x = n.to; });
    return x;
  }
  /* Commons metadata is HTML; parse it in an inert document and keep the text. */
  const plainText = html => { try { return (new DOMParser().parseFromString(String(html || ''), 'text/html').body.textContent || '').replace(/\s+/g, ' ').trim(); } catch (e) { return ''; } };

  async function loadPhotos(titles) {
    const need = [...new Set(titles.filter(t => t && !(t in PH) && !photoAsked.has(t) && !(PACK[t] && PACK[t].ds)))];
    if (!need.length || !canFetchPhotos()) return false;
    need.forEach(t => photoAsked.add(t));
    let changed = false;
    for (let i = 0; i < need.length; i += 40) {
      const batch = need.slice(i, i + 40);
      try {
        const a = await wikiApi({ redirects: '1', prop: 'pageimages', piprop: 'thumbnail|name', pithumbsize: '960', pilicense: 'free', titles: batch.join('|') });
        const qa = a.query || {}, pages = qa.pages || [];
        const found = {};
        batch.forEach(t => {
          const pg = pages.find(p => p.title === resolveTitle(qa, t));
          if (pg && pg.pageimage && pg.thumbnail && pg.thumbnail.source && /\.(jpe?g|webp)$/i.test(pg.pageimage)) found[t] = pg; else PH[t] = 0;
        });
        const names = [...new Set(Object.values(found).map(p => p.pageimage))];
        if (names.length) {
          const b = await wikiApi({ prop: 'imageinfo', iiprop: 'url|extmetadata', iiurlwidth: '500', iiextmetadatafilter: 'Artist|LicenseShortName|LicenseUrl', titles: names.map(n => 'File:' + n).join('|') });
          const qb = b.query || {}, fpages = qb.pages || [];
          Object.keys(found).forEach(t => {
            const pg = found[t];
            const fp = fpages.find(p => p.title === resolveTitle(qb, 'File:' + pg.pageimage));
            const ii = fp && fp.imageinfo && fp.imageinfo[0];
            const md = (ii && ii.extmetadata) || {};
            const lic = plainText(md.LicenseShortName && md.LicenseShortName.value).slice(0, 40);
            if (!ii || !lic) { PH[t] = 0; return; }
            const licUrl = String((md.LicenseUrl && md.LicenseUrl.value) || '');
            PH[t] = {
              s: ii.thumburl || pg.thumbnail.source, l: pg.thumbnail.source,
              by: plainText(md.Artist && md.Artist.value).slice(0, 90) || 'Wikimedia Commons', lic,
              licUrl: /^https?:\/\//.test(licUrl) ? licUrl : '',
              page: /^https:\/\//.test(ii.descriptionurl || '') ? ii.descriptionurl : 'https://commons.wikimedia.org/wiki/File:' + encodeURIComponent(pg.pageimage),
              file: pg.pageimage
            };
            changed = true;
          });
        }
      } catch (e) { batch.forEach(t => photoAsked.delete(t)); }
    }
    store.set(PHOTO_KEY, { t: Date.now(), items: PH });
    return changed;
  }
  /* Ask for the photos the current screens need: every city's main photo and the current city's places. */
  function wantPhotos() {
    if (!canFetchPhotos()) return;
    const titles = CITIES.map(c => c.photo).concat((curCity().places || []).map(p => p.wiki));
    loadPhotos(titles.filter(Boolean)).then(ch => { if (ch) refresh(); }).catch(() => { /* keep illustrations */ });
  }

  /* ---------- Copy with photos built in ---------- */
  function blobToDataURL(b) { return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(b); }); }
  async function shrink(blob, maxW) {
    try {
      const bmp = await createImageBitmap(blob);
      const k = Math.min(1, maxW / bmp.width), w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
      const out = cv.toDataURL('image/jpeg', 0.7);
      return out.length < 40 ? blobToDataURL(blob) : out;
    } catch (e) { return blobToDataURL(blob); }
  }
  async function grab(url, maxW) {
    const r = await fetch(url, { credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (!r.ok) throw new Error('photo ' + r.status);
    return shrink(await r.blob(), maxW);
  }
  let copyBusy = false;
  async function saveCopyWithPhotos(btn) {
    if (copyBusy) return;
    if (!PRISTINE || !canFetchPhotos()) { toast('Open the app file in a browser, online, to save a copy with photos'); return; }
    copyBusy = true;
    const label = btn ? btn.innerHTML : '';
    const say = m => { if (btn) btn.textContent = m; };
    try {
      say('Finding photos…');
      const all = [...new Set(CITIES.flatMap(c => [c.photo].concat(c.places.map(p => p.wiki))).filter(Boolean))];
      await loadPhotos(all);
      const big = new Set(CITIES.map(c => c.photo).filter(Boolean));
      allTrips().filter(t => t._src === 'builtin').forEach(t => { const w = tripPhotoTitle(t); if (w) big.add(w); });
      const list = all.filter(t => PH[t] && PH[t].s);
      const pack = {};
      let done = 0;
      const work = list.slice();
      const worker = async () => {
        while (work.length) {
          const t = work.shift(), e = PH[t];
          try {
            const ds = await grab(e.s, 560);
            const dl = big.has(t) && e.l && e.l !== e.s ? await grab(e.l, 1024) : '';

          } catch (err) { /* skip this photo */ }
          done++; say('Saving photos… ' + done + ' / ' + list.length);
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      Object.keys(PACK).forEach(t => { if (!pack[t] && PACK[t] && isData(PACK[t].ds)) pack[t] = PACK[t]; });
      const n = Object.keys(pack).length;
      if (!n) { toast('No photos could be downloaded. Check the connection and try again.'); return; }
      const json = JSON.stringify({ v: 1, made: dayKey(), photos: pack }).replace(/</g, '\\u003c');
      let html = PRISTINE;
      const i = html.indexOf('<div id="app">'), j = i < 0 ? -1 : html.indexOf('</div>', i);

  /* ---------- Shared components ---------- */
  const trailVar = t => { const k = esc((t && t.trail) || 'red'); return 'style="--trail:var(--' + k + ');--trail-ink:var(--' + k + '-ink, var(--on-accent));--trail-text:var(--' + k + '-text, var(--' + k + '))"'; };
  function pic(type, seed, cls) { return '<div class="pic' + (cls ? ' ' + cls : '') + '">' + WRScenes.toSVG(type, seed) + '</div>'; }
  /* A photo with its credit, drawn over the illustration (which shows if the photo cannot load). */
  const creditText = e => 'Photo: ' + (e.by || 'Wikimedia Commons') + (e.lic ? ' · ' + e.lic : '');
  function photoPic(title, type, seed, cls, big, plainCredit) {
    const e = photoOf(title);
    if (!e) return pic(type, seed, cls);
    const src = big ? (e.l || e.s) : e.s;
    const set = !e.local && e.l && e.s && e.l !== e.s ? ' srcset="' + esc(e.s) + ' 500w, ' + esc(e.l) + ' 960w" sizes="' + (big ? '(max-width: 760px) 100vw, 1100px' : '(max-width: 760px) 100vw, 480px') + '"' : '';
    const credit = plainCredit ? '<span class="ph-credit">' + esc(creditText(e)) + '</span>'
      : '<a class="ph-credit" href="' + esc(e.page) + '" target="_blank" rel="noopener noreferrer" title="Photo on Wikimedia Commons">' + esc(creditText(e)) + '</a>';
    return '<div class="pic photo' + (cls ? ' ' + cls : '') + '">' + WRScenes.toSVG(type, seed) + '<img src="' + esc(src) + '"' + set + ' alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer">' + credit + '</div>';
  }
  function walkedChip(t) {
    return t.walked ? '<span class="chip good">' + ico('check') + 'Walked and timed ' + fmtDate(t.walked) + '</span>'
      : '<span class="chip" title="Walking times come from real distances at a relaxed pace">' + ico('walk') + 'Times estimated · not walk-tested yet</span>';
  }
  function tripCard(t) {

    return '<button class="tcard" data-act="go" data-view="trip" data-id="' + esc(t.id) + '" ' + trailVar(t) + '>' +
      photoPic(tripPhotoTitle(t), (t.stops[0] && t.stops[0].type) || 'other', t.id, '', false, true) +
      '<div class="bd"><span class="tag"><span class="tm"></span>' + esc(kindLabel(t)) + ' · ' + esc(cityLabel(t)) + '</span>' +
      '<h3>' + esc(t.title || 'Untitled trip') + '</h3>' + (t.tagline ? '<p>' + esc(t.tagline) + '</p>' : '') +
      '<div class="meta"><span>' + C.fmtDur(c.total) + '</span><span>' + (c.distM ? C.fmtDist(c.distM) : '–') + '</span><span>' + c.stops + ' stops</span>' + (by ? '<span>by ' + esc(by) + '</span>' : '') + '</div></div></button>';
  }
  function newTripCard(label) {
    return '<button class="tcard new" data-act="new-trip"><span class="plus">+</span><h3>' + esc(label || 'Create your own route') + '</h3><p class="muted">Pick places from the library, add a lunch stop, sort them into walking order and get a PDF guide.</p></button>';
  }
  function postCard(p, feature) {
    const c = getCity(p.city);
    return '<button class="pcard' + (feature ? ' feature' : '') + '" data-act="go" data-view="post" data-id="' + p.id + '">' + pic(p.scene, p.id) +
      '<div><span class="chip blue cat">' + esc(p.category) + '</span>' + (c ? ' <span class="chip cat">' + esc(c.name) + '</span>' : '') + '<h3>' + esc(p.title) + '</h3><p>' + esc(p.excerpt) + '</p><p class="mono muted" style="font-size:13px;margin-top:10px">' + fmtDate(p.date) + ' · ' + p.read + ' min read</p></div></button>';
  }
  function cityStats(c) {

  }
  function cityCard(c, big) {

      '<div class="bd"><span class="tag"><span class="tm"></span>' + esc(c.country) + (c.id === S.city ? ' · your city' : '') + '</span>' +
      '<h3>' + esc(c.name) + (c.local !== c.name ? ' <small>' + esc(c.local) + '</small>' : '') + '</h3><p>' + esc(c.tag) + '</p>' +
      '<div class="meta">' + (gc ? '<span>' + gc.stops + '-stop guide · ' + C.fmtDur(gc.total) + '</span>' : '') + '<span>' + st.places + ' places</span><span>' + st.eats + ' places to eat</span>' + (st.events ? '<span>' + st.events + ' event' + (st.events > 1 ? 's' : '') + '</span>' : '') + '</div>' +
      '<div class="row" style="margin-top:14px"><button class="btn btn-sm btn-primary" data-act="set-city" data-city="' + c.id + '" data-home="1">Explore ' + esc(c.name) + '</button>' +
      (g ? '<button class="btn btn-sm" data-act="download" data-id="' + esc(g.id) + '">' + ico('dl') + 'PDF</button>' : '') + '</div></div></article>';
  }
  function mapSVG(t, w, h) {
    w = w || 600; h = h || 430;
    const pr = C.project(t, w, h, 42);
    let s = '<svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="Route map with ' + t.stops.length + ' numbered stops">';
    s += '<rect width="' + w + '" height="' + h + '" fill="var(--map-bg)"/>';
    for (let x = 0; x <= w; x += 40) s += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + h + '" stroke="var(--map-grid)" stroke-width="1"/>';
    for (let y = 0; y <= h; y += 40) s += '<line x1="0" y1="' + y + '" x2="' + w + '" y2="' + y + '" stroke="var(--map-grid)" stroke-width="1"/>';
    pr.water.forEach(l => { s += '<polyline points="' + l.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ') + '" fill="none" stroke="var(--river)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>'; });
    const pts = pr.pts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');
    if (pr.pts.length > 1) {
      s += '<polyline points="' + pts + '" fill="none" stroke="var(--map-bg)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>';
      s += '<polyline points="' + pts + '" fill="none" stroke="var(--trail)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"' + (pr.schematic ? ' stroke-dasharray="8 8"' : '') + '/>';
    }
    pr.pts.forEach((p, i) => {
      s += '<g class="pin" data-act="pin" data-i="' + i + '" transform="translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')" tabindex="0" role="button" aria-label="Stop ' + (i + 1) + ': ' + esc(t.stops[i].name) + '"><title>' + (i + 1) + '. ' + esc(t.stops[i].name) + '</title><circle r="14"/><text>' + (i + 1) + '</text></g>';
    });
    if (!pr.schematic && pr.metersPerUnit) {
      const target = [50, 100, 200, 250, 500, 1000, 2000, 5000].find(m => m / pr.metersPerUnit > 60) || 500;
      const len = target / pr.metersPerUnit;
      s += '<line x1="16" y1="' + (h - 18) + '" x2="' + (16 + len).toFixed(1) + '" y2="' + (h - 18) + '" stroke="var(--ink)" stroke-width="3"/><text x="' + (22 + len).toFixed(1) + '" y="' + (h - 14) + '" fill="var(--ink)" font-size="12" font-family="var(--mono)">' + (target >= 1000 ? target / 1000 + ' km' : target + ' m') + '</text>';
    }
    return s + '</svg>';
  }
  function mapBox(t) {
    const c = C.compute(t);
    const sch = C.project(t, 10, 10).schematic;
    return '<div class="mapbox">' + mapSVG(t) + '<div class="cap"><span>' + (sch ? 'Schematic layout. Add coordinates for a real map.' : 'Schematic map, north up. Water and streets simplified.') + '</span><span class="mono">' + (c.distM ? C.fmtDist(c.distM) : '') + '</span></div></div>';
  }
  function saveBtn(key, label) {
    const on = S.saved.has(key);
    return '<button class="btn' + (on ? ' on' : '') + '" data-act="save" data-key="' + esc(key) + '" aria-pressed="' + on + '">' + ico('save', on) + (on ? 'Saved' : (label || 'Save')) + '</button>';
  }
  function shareBtn(key, title) { return '<button class="btn" data-act="share" data-key="' + esc(key) + '" data-title="' + esc(title) + '">' + ico('share') + 'Share</button>'; }
  function hline(t) {
    const c = C.compute(t);
    return '<div class="hline-wrap"><div class="hline">' + t.stops.map((s, i) => '<button class="hstop" data-act="go" data-view="trip" data-id="' + esc(t.id) + '" data-stop="' + i + '"><div class="t">' + C.fmtClock(c.schedule[i].arrive) + '</div><div class="dot">' + (i + 1) + '</div><div class="n">' + esc(s.name.replace(/\s*\(.*\)/, '').replace(/^Lunch stop: /, 'Lunch: ')) + '</div><div class="w">' + s.stay + ' min</div></button>').join('') + '</div></div>';
  }
  function cityStrip(label) {
    const others = CITIES.filter(c => c.id !== S.city);
    return '<div class="city-strip"><span class="muted">' + esc(label || 'Going somewhere else?') + '</span>' + others.map(c => '<button class="btn btn-sm btn-ghost" data-act="set-city" data-city="' + c.id + '" style="--trail:var(--' + c.trail + ')"><span class="tm" aria-hidden="true"></span>' + esc(c.name) + '</button>').join('') +
      '<button class="btn btn-sm btn-ghost" data-act="go" data-view="cities">' + ico('globe') + 'All cities</button></div>';
  }

  /* ---------- Meal stops ---------- */
  function mealBlock(t, s) {
    const key = mealKey(t, s), pick = S.meals[key];
    const opts = s.meals.map(o => {
      const on = pick === o.id;
      const m = C.hasCoord(o) && C.hasCoord(s) ? C.hav(s, o) * 1.25 : null;
      const walk = m == null ? '' : m < 80 ? 'right here' : Math.max(1, Math.round(m / 75)) + ' min walk';
      const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([o.name, o.address, t.city || cityLabel(t)].filter(Boolean).join(', '));
      return '<div class="meal' + (on ? ' on' : '') + '"><button class="meal-pick" data-act="meal-pick" data-key="' + esc(key) + '" data-opt="' + esc(o.id) + '" aria-pressed="' + on + '">' +
        '<span class="radio" aria-hidden="true"></span><span class="mt"><b>' + esc(o.name) + '</b><small>' + esc([o.kind, o.price].filter(Boolean).join(' · ')) + '</small></span>' +
        (walk ? '<span class="mm mono">' + walk + '</span>' : '') + '</button>' +
        '<div class="md">' + (o.address ? '<span class="addr">' + ico('pin') + esc(o.address) + '</span>' : '') + (o.note ? '<p>' + esc(o.note) + '</p>' : '') +
        '<a class="btn btn-sm btn-ghost" href="' + esc(maps) + '" target="_blank" rel="noopener noreferrer">' + ico('map') + 'Google Maps</a></div></div>';
    }).join('');
    const chosen = s.meals.find(o => o.id === pick);
    return '<div class="meals"><div class="mh"><span class="eyebrow">' + ico('fork') + ' Choose where to eat · ' + s.meals.length + ' options</span>' +
      (chosen ? '<span class="chip green">Your pick: ' + esc(chosen.name) + '</span>' : '<span class="muted" style="font-size:13.5px">Tap one to pick it. It goes into your PDF.</span>') + '</div>' +
      '<div class="meal-list">' + opts + '</div><p class="muted" style="font-size:12.5px;margin-top:10px">Opening hours change. Check them on the day.</p></div>';
  }

  /* ---------- Events ---------- */
  function evStatus(ev) {
    if (!ev.start) return { cls: 'tba', text: 'Dates not announced yet' };
    const today = dayKey();
    const days = Math.round((new Date(ev.start + 'T12:00:00') - new Date(today + 'T12:00:00')) / 86400000);
    if (today < ev.start) return { cls: 'soon', text: days === 1 ? 'Starts tomorrow' : 'Starts in ' + days + ' days' };
    if (today <= ev.end) return { cls: 'on', text: 'On now · until ' + fmtDate(ev.end) };
    return { cls: 'past', text: 'Ended' };
  }
  function gcalUrl(ev) {
    const c = getCity(ev.cityId), d = s => s.replace(/-/g, '');
    const end = new Date(ev.end + 'T12:00:00'); end.setDate(end.getDate() + 1);
    const endS = end.getFullYear() + String(end.getMonth() + 1).padStart(2, '0') + String(end.getDate()).padStart(2, '0');
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ev.title) + '&dates=' + d(ev.start) + '/' + endS +
      '&details=' + encodeURIComponent(ev.hours + '. ' + ev.exceptions + ' ' + ev.url) + '&location=' + encodeURIComponent(ev.place + (c ? ', ' + c.name : ''));
  }
  function icsFor(ev) {
    const c = getCity(ev.cityId), d = s => s.replace(/-/g, '');
    const end = new Date(ev.end + 'T12:00:00'); end.setDate(end.getDate() + 1);
    const endS = end.getFullYear() + String(end.getMonth() + 1).padStart(2, '0') + String(end.getDate()).padStart(2, '0');
    const escI = s => String(s).replace(/[\\;,]/g, m => '\\' + m);
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//WeekendReady//Events//EN', 'BEGIN:VEVENT', 'UID:' + ev.id + '@weekendready',
      'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z', 'DTSTART;VALUE=DATE:' + d(ev.start), 'DTEND;VALUE=DATE:' + endS,
      'SUMMARY:' + escI(ev.title), 'LOCATION:' + escI(ev.place + (c ? ', ' + c.name : '')), 'DESCRIPTION:' + escI(ev.hours + '. ' + ev.exceptions + ' ' + ev.url), 'URL:' + ev.url,
      'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  }
  function eventCard(ev, big) {
    const st = evStatus(ev), r = ev.routeId ? getTrip(ev.routeId) : null, c = r ? C.compute(r) : null, key = 'event:' + ev.id, city = getCity(ev.cityId);
    return '<article class="event' + (big ? ' big' : '') + '"' + (r ? ' ' + trailVar(r) : '') + '>' + pic(ev.scene, ev.id, 'ev-pic') +
      '<div class="ev-bd"><div class="row"><span class="chip ' + (st.cls === 'on' ? 'green' : st.cls === 'soon' ? 'red' : '') + '">' + esc(st.text) + '</span>' + (city ? '<span class="chip">' + esc(city.name) + '</span>' : '') + '<span class="chip">' + esc(ev.local) + '</span></div>' +
      '<h2>' + esc(ev.title) + '</h2><p class="ev-dates mono">' + (ev.start ? fmtDate(ev.start) + ' – ' + fmtDate(ev.end) : esc(ev.when || 'Dates to be announced')) + '</p><p class="lead2">' + esc(ev.summary) + '</p>' +
      (big ? '<dl class="kv"><dt>Hours</dt><dd>' + esc(ev.hours) + (ev.exceptions ? '<br><span class="muted">' + esc(ev.exceptions) + '</span>' : '') + '</dd><dt>Where</dt><dd>' + esc(ev.place) + '</dd><dt>Price</dt><dd>' + esc(ev.price) + '</dd></dl>' +
        '<h3 class="ev-hl-h">What to look for</h3><ul class="ev-hl">' + ev.highlights.map(h => '<li>' + esc(h) + '</li>').join('') + '</ul>' : '') +
      '<div class="row ev-act">' + (r ? '<button class="btn btn-primary" data-act="go" data-view="trip" data-id="' + esc(r.id) + '">' + ico('map') + 'Walk the evening route</button>' : '') +
      (big ? (ev.start ? '<a class="btn" href="' + esc(gcalUrl(ev)) + '" target="_blank" rel="noopener noreferrer">' + ico('cal') + 'Google Calendar</a>' + (!inViewer() ? '<button class="btn" data-act="ics" data-id="' + esc(ev.id) + '">' + ico('dl') + 'Calendar file (.ics)</button>' : '') : '') +
        (r ? '<button class="btn" data-act="download" data-id="' + esc(r.id) + '">' + ico('dl') + 'Route PDF</button>' : '') + saveBtn(key) + shareBtn(key, ev.title)
        : '<button class="btn" data-act="go" data-view="events" data-evcity="' + esc(ev.cityId) + '">Details</button>') + '</div>' +
      (big && r ? '<p class="muted ev-note">Evening route: ' + c.stops + ' stops · ' + C.fmtDist(c.distM) + ' · about ' + C.fmtDur(c.total) + '.</p>' : '') +
      (big ? '<p class="muted ev-note">' + esc(ev.checked) + ' <a href="' + esc(ev.url) + '" target="_blank" rel="noopener noreferrer">Official site</a></p>' : '') +
      '</div></article>';
  }

  /* ---------- Share ---------- */
  function shareBase() {
    const set = (S.settings.shareUrl || '').trim();
    if (set) return set.split('#')[0];
    if (!inViewer() && /^https?:$/.test(location.protocol)) return location.href.split('#')[0];
    return '';
  }
  function shareUrl(key) {
    const base = shareBase(); if (!base) return '';
    const [type, id] = [key.slice(0, key.indexOf(':')), key.slice(key.indexOf(':') + 1)];
    const anchor = type === 'trip' ? 'trip-' + id : type === 'post' ? 'post-' + id : type === 'event' ? 'events' : type === 'city' ? 'city-' + id : '';
    return base + (anchor ? '#' + anchor : '');
  }
  function closeShare() { const p = $('#share-pop'); if (p) p.remove(); S.shareFor = null; }

    closeShare();
    S.shareFor = key;
    const url = shareUrl(key), text = title + ' · WeekendReady', e = encodeURIComponent;
    const opt = (ch, label, href) => '<a class="btn btn-sm btn-ghost" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer" data-act="share-ch" data-ch="' + ch + '">' + label + '</a>';
    const p = document.createElement('div');
    p.className = 'share-pop'; p.id = 'share-pop'; p.setAttribute('role', 'dialog'); p.setAttribute('aria-label', 'Share');
    p.innerHTML = '<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3>Share “' + esc(title) + '”</h3><button class="icon-btn" data-act="close-share" aria-label="Close">' + ico('x') + '</button></div>' +
      '<div class="opts"><button class="btn btn-sm btn-ghost" data-act="share-copy">' + ico('copy') + 'Copy</button>' +
      opt('whatsapp', 'WhatsApp', 'https://wa.me/?text=' + e(text + (url ? ' ' + url : ''))) +
      opt('telegram', 'Telegram', 'https://t.me/share/url?url=' + e(url || text) + (url ? '&text=' + e(text) : '')) +
      opt('x', 'X', 'https://twitter.com/intent/tweet?text=' + e(text) + (url ? '&url=' + e(url) : '')) +
      (url ? opt('facebook', 'Facebook', 'https://www.facebook.com/sharer/sharer.php?u=' + e(url)) + opt('linkedin', 'LinkedIn', 'https://www.linkedin.com/sharing/share-offsite/?url=' + e(url)) : '') +
      '</div><label class="sr" for="share-field">Link to share</label><input type="text" id="share-field" readonly value="' + esc(url ? text + ' ' + url : text) + '">' +
      (url ? '' : '<p class="muted" style="font-size:13px;margin-top:10px">No public link is set yet, so only the title is shared. Add the app’s link on the Dashboard under Sharing.</p>');
    document.body.appendChild(p);
    $('button', p).focus();
  }


  /* ---------- Views ---------- */
  function faq(q, a) { return '<div><h3 style="font-size:18px;font-weight:700">' + q + '</h3><p class="muted" style="margin-top:6px">' + a + '</p></div>'; }
  function notFound(msg, back) { return '<div class="wrap"><section class="block"><h2 style="font-size:32px">Not found</h2><p class="muted" style="margin-top:10px">' + msg + '</p><button class="btn" style="margin-top:20px" data-act="go" data-view="' + back + '">Go back</button></section></div>'; }
